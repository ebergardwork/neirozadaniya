.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}

.mlist{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}

.fly{display:grid;gap:3px;width:150px;grid-template-columns:repeat(var(--n),1fr)}

.foot{font-size:12px;color:var(--muted);text-align:center;max-width:70ch;margin:0 auto}

.sheetwrap{overflow-x:auto}
.sheet{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:26px;max-width:794px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.sheet .prow{background:transparent;border-bottom:1px solid #ddd;border-radius:0}

function bandFor(age){return age<6?3:age<9?6:9}
function bw(t,age){var m=bandFor(age);return t.words.filter(function(w){return w[2]<=m})}
function wl(w,lang){return lang==="ru"?w[0]:w[1]}
function themeName(t,lang){return lang==="ru"?t.ru.toLowerCase():t.en.toLowerCase()}
var CONF=[["fruit","berries","veg","food"],["pets","wild"],["clothes","shoes"],["furniture","appliances","house","dishes"],["tools","school"],["trees","flowers"],["birds","insects"]];
function clash(a,b){return a===b||CONF.some(function(g){return g.indexOf(a.id)>=0&&g.indexOf(b.id)>=0})}
function themesFor(age){return BANK.themes.filter(function(t){return bw(t,age).length>=6})}
GAMES.chain.gen=function(r,age,lang){var th=pick(r,themesFor(age)),start=age<5?2:age<7?3:age<10?4:5;
 return '<p><b>'+(lang==="ru"?"Тема: ":"Theme: ")+themeName(th,lang)+'</b> · '+(lang==="ru"?"начните с цепочки из ":"start with a chain of ")+start+'</p>'+note(lang==="ru"?"Слова-подсказки для вас:":"Word ideas for you:")+chips(shuffle(r,bw(th,age)).slice(0,12).map(function(w){return wl(w,lang)}))};
GAMES.food.gen=function(r,age,lang){

 if(age<5){yesT=T.filter(function(t){return t.edible});noT=T.filter(function(t){return !t.edible&&!t.alive&&t.id!=="body"});rule=lang==="ru"?"Ловим, если это можно съесть.":"Catch it if you can eat it."}
 else if(age<7||r()<.35){var al=r()<.5;yesT=T.filter(function(t){return al?t.alive:t.edible});noT=T.filter(function(t){return al?(!t.alive&&!t.edible&&t.id!=="body"):(!t.edible&&!t.alive&&t.id!=="body")});
  rule=al?(lang==="ru"?"Ловим, если это живое.":"Catch it if it is alive."):(lang==="ru"?"Ловим, если это можно съесть.":"Catch it if you can eat it.")}
 else{var one=pick(r,T.filter(function(t){return t.id!=="body"}));yesT=[one];noT=T.filter(function(t){return !clash(t,one)&&t.id!=="body"});

var RT=null; // {id, lv, seed, task, mode, ...}
function startTask(id,lv,seed,mode){
  stopStream();
  var task=TYPES[id].build(lv,rng(seed*31+lv*7+(S.alpha==="en"?3:0)+id.length*101),{alpha:S.alpha});
  RT={id:id,lv:lv,seed:seed,task:task,mode:mode,marks:[],checked:false,t0:0,tool:task.tools?task.tools[0]:null,next:0,errors:0,pairs:{},sel:null,answers:{},st:null};
  if(task.kind==="cells")RT.marks=task.items.map(function(){return null});
  RT.assign={};RT.board={};RT.pal=task.objs?task.objs[0].s:null;RT.segs=[];RT.dsel=null;RT.strokes=[];RT.step=0;
  RT.mem={r:0,phase:"ready",score:[],pick:[],timer:null};
}
function stopStream(){if(RT&&RT.st&&RT.st.timer){clearTimeout(RT.st.timer);RT.st.timer=null}if(RT&&RT.mem&&RT.mem.timer){clearTimeout(RT.mem.timer);RT.mem.timer=null}}

function fmtTime(ms){var s=Math.round(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function stats(list){return '<div class="results">'+list.map(function(x){return '<div class="stat'+(x[2]?" ok":"")+'"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>'}).join("")+'</div>'}

function screenCols(c){var w=Math.min(window.innerWidth,980)-70;return Math.min(c,Math.max(4,Math.floor(w/44)))}

function renderTaskBody(){
  var t=RT.task,h="",L=S.lang;
  var printing=RT.mode==="print";
  var rule=(printing&&t.printRule?t.printRule:t.rule)(L);
  if(printing)return renderSheet(t,rule);
  h+='<div class="rule">'+(t.samples?'<div class="samples">'+t.samples+'</div>':'')+'<p>'+rule+'</p></div>';
  h+='<div class="actions"><button class="btn ghost" data-act="speak">'+ICON_SPK+tr(UI.listen)+'</button>';
  if(t.kind==="cells"&&t.tools.length>1)h+='<div class="tools" role="group">'+t.tools.map(function(m){return '<button data-act="tool" data-v="'+m+'" aria-pressed="'+(RT.tool===m)+'">'+boxed("",m)+tr(UI[m])+'</button>'}).join("")+'</div>';
  if(t.kind==="place")h+='<div class="tools" role="group">'+t.objs.map(function(o){return '<button data-act="pal" data-v="'+o.s+'" aria-pressed="'+(RT.pal===o.s)+'">'+boxed(fig({s:o.s,c:SHCOL[o.s]}))+'</button>'}).join("")+'</div>';
  if(t.kind==="trace")h+='<button class="btn ghost" data-act="tclear">'+tr(UI.clear)+'</button>';
  h+='</div>';
  if(t.top)h+='<div class="topfig">'+fixTop(t.top)+'</div>'+(t.topScreenLabel?'<div class="pairlabel">'+tr(t.topScreenLabel)+'</div>':'');
  if(t.kind==="cells"){
    h+='<div class="grid'+(t.rows?" rows":"")+'" data-g="1" style="--cols:'+(t.rows||t.top?t.cols:screenCols(t.cols))+(t.top||t.rows?';max-width:'+(t.cols*78)+'px':'')+'">';
    t.items.forEach(function(s,i){
      if(t.dividers[i])h+='<div class="divider"><span>'+tr(t.dividers[i])+'</span>'+(t.dividers[i].html?'<span class="samples">'+t.dividers[i].html+'</span>':'')+'</div>';
      var m=RT.marks[i],res="";if(RT.checked){var e=t.expect[i];if(e&&!m)res=" r-miss";else if(m&&m!==e)res=" r-wrong"}
      h+='<button class="cell'+(t.big?" big":"")+res+'" data-act="cell" data-i="'+i+'">'+s+'<span class="mark">'+(m?MARK[m]:"")+'</span></button>'});
    h+='</div>';
    if(RT.checked){var ok=0,miss=0,wr=0,tot=0;t.expect.forEach(function(e,i){var m=RT.marks[i];if(e)tot++;if(e&&m===e)ok++;else if(e&&!m)miss++;else if(m&&m!==e)wr++});
      h+=stats([[tr(UI.found),ok+" / "+tot,1],[tr(UI.missed),miss],[tr(UI.wrong),wr],[tr(UI.time),fmtTime(RT.elapsed)]])+'<p class="note">'+(miss+wr?tr(UI.legend):tr(UI.great))+'</p>'}
  }
  else if(t.kind==="order"){
    h+='<div class="grid" style="--cols:'+t.cols+';max-width:'+(t.cols*84)+'px">'+t.cells.map(function(c,i){return '<button class="cell big'+(c.ord<RT.next?" done":"")+'" data-act="ord" data-i="'+i+'">'+c.html+'</button>'}).join("")+'</div>';
    h+='<div class="bar"><i style="width:'+(100*RT.next/t.total)+'%"></i></div>';
    if(RT.checked)h+=stats([[tr(UI.time),fmtTime(RT.elapsed),1],[tr(UI.wrong),RT.errors]]);
  }
  else if(t.kind==="pattern"){
    t.rows.forEach(function(row,ri){var a=RT.answers[ri];
      h+='<div class="prow"><div class="pseq">'+row.seq.map(function(x){return boxed(x)}).join("")+'<span class="blank'+(a!=null?" ok":"")+'">'+(a!=null?'<span class="box">'+row.ansHtml+'</span>':'')+'</span></div>';
      if(a==null)h+='<div class="popts">'+row.opts.map(function(o,k){return '<button data-act="opt" data-r="'+ri+'" data-k="'+k+'">'+o+'</button>'}).join("")+'</div>';
      h+='</div>'});
    if(RT.checked)h+=stats([[tr(UI.found),t.rows.length+" / "+t.rows.length,1],[tr(UI.wrong),RT.errors],[tr(UI.time),fmtTime(RT.elapsed)]]);
  }
  else if(t.kind==="lines"){h+=linesSVG(t,false);
    if(RT.checked){var c=0;for(var i=0;i<t.n;i++)if(RT.pairs[i]===t.perm[i])c++;h+=stats([[tr(UI.found),c+" / "+t.n,1],[tr(UI.time),fmtTime(RT.elapsed)]])}
  }
  else if(t.kind==="stream"){h+=streamStage();}
  else if(t.kind==="quiz"){
    t.items.forEach(function(q,qi){var a=RT.answers[qi];
      h+='<div class="prow">'+q.q.replace("{{B}}",'<span class="mcell blank'+(a!=null?" ok":"")+'">'+(a!=null?q.ansHtml:"")+'</span>');

      h+='</div>'});
    if(RT.checked)h+=stats([[tr(UI.found),t.items.length+" / "+t.items.length,1],[tr(UI.wrong),RT.errors],[tr(UI.time),fmtTime(RT.elapsed)]]);
  }
  else if(t.kind==="sort"){
    var pool=t.items.map(function(it,i){return RT.assign[i]==null?'<button class="sitem'+(RT.sel===i?" sel":"")+'" data-act="sitem" data-i="'+i+'">'+it.html+'</button>':''}).join("");
    h+='<div class="spool">'+(pool||'<span class="note">'+tr(UI.allSorted)+'</span>')+'</div>';
    h+='<div class="bins">'+t.bins.map(function(lab,b){return '<div class="bin" role="button" tabindex="0" data-act="sbin" data-b="'+b+'"><div class="binlab">'+lab+'</div><div class="binitems">'+
      t.items.map(function(it,i){if(RT.assign[i]!==b)return "";var bad=RT.checked&&it.g!==b;return '<button class="sitem small'+(bad?" bad":"")+(RT.sel===i?" sel":"")+'" data-act="sitem" data-i="'+i+'">'+it.html+'</button>'}).join("")+'</div></div>'}).join("")+'</div>';
    if(RT.checked){var okc=0;t.items.forEach(function(it,i){if(RT.assign[i]===it.g)okc++});h+=stats([[tr(UI.found),okc+" / "+t.items.length,1],[tr(UI.time),fmtTime(RT.elapsed)]])}
  }
  else if(t.kind==="mem")h+=memStage();
  else if(t.kind==="dict"){
    h+='<div class="chiprow">'+t.cmds.map(function(c,i){var cur=RT.step<t.units.length&&t.ci[RT.step]===i;var past=RT.step>=t.units.length||t.ci[RT.step]>i;return '<span class="'+(cur?"hl":"")+(past?" past":"")+'">'+c.n+ARR[c.d]+'</span>'}).join("")+'</div>';
    h+=dictSVG(t,false);
    if(RT.step<t.units.length)h+='<div class="arrows">'+["l","u","d","r"].map(function(d){return '<button data-act="arr" data-v="'+d+'" aria-label="'+d+'">'+ARR[d]+'</button>'}).join("")+'</div>';
    else h+=stats([[tr(UI.wrong),RT.errors,!RT.errors],[tr(UI.time),fmtTime(RT.elapsed)]]);
  }
  else if(t.kind==="place"){
    h+='<ol class="mlist">'+t.steps(L,false).map(function(s){return '<li>'+s+'</li>'}).join("")+'</ol>';
    h+='<div class="grid pboard" style="--cols:'+t.n+'">'+range(t.n*t.n).map(function(i){var s=RT.board[i],res="";
      if(RT.checked){var exp=t.objs.filter(function(o){return o.y*t.n+o.x===i})[0];if(exp&&s!==exp.s)res=" r-miss";else if(s&&(!exp||exp.s!==s))res=" r-wrong"}
      return '<button class="cell'+res+'" data-act="pcell" data-i="'+i+'">'+(s?fig({s:s,c:SHCOL[s]}):"")+'</button>'}).join("")+'</div>';
    if(RT.checked){var okp=t.objs.filter(function(o){return RT.board[o.y*t.n+o.x]===o.s}).length;h+=stats([[tr(UI.found),okp+" / "+t.objs.length,1],[tr(UI.time),fmtTime(RT.elapsed)]])}
  }
  else if(t.kind==="dots"){
    h+='<div class="dotpair"><div><div class="pairlabel">'+tr(UI.sample)+'</div>'+dotsSVG(t,t.sample,false,false)+'</div><div><div class="pairlabel">'+tr(UI.yours)+'</div>'+dotsSVG(t,RT.segs,true,false)+'</div></div>';
    if(RT.checked){var tg=t.target,ok2=tg.filter(function(k){return RT.segs.indexOf(k)>=0}).length,ex2=RT.segs.filter(function(k){return tg.indexOf(k)<0}).length;
      h+=stats([[tr(UI.found),ok2+" / "+tg.length,1],[tr(UI.extraLines),ex2],[tr(UI.time),fmtTime(RT.elapsed)]])}
  }
  else if(t.kind==="trace"){
    h+=traceSVG(t,false);
    if(RT.checked){var ev=evalTrace(t);h+=stats([[tr(UI.accuracy),ev.acc+"%",1],[tr(UI.covered),ev.cov+"%"]])}
  }
  var act='<div class="actions">';
  var needDone=["cells","lines","place","dots","sort","trace"].indexOf(t.kind)>=0&&!RT.checked;
  if(needDone)act+='<button class="btn" data-act="done">'+tr(UI.done)+'</button>';
  act+='<button class="btn'+(needDone?" ghost":"")+'" data-act="new">'+tr(UI.newTask)+'</button>';
  if(t.kind!=="stream")act+='<button class="btn ghost" data-act="again">'+tr(UI.again)+'</button>';
  act+='<span class="variant">'+tr(UI.variant)+' '+RT.seed+'</span></div>';
  return h+act;
}

function linesSVG(t,printing){
  var W=t.W,H=t.H,s='<svg class="lines" viewBox="0 0 '+W+' '+H+'" role="img">';
  t.paths.forEach(function(d,i){var c=t.colors?t.colors[i]:"currentColor",okc="";
    if(!printing&&RT.checked)okc=RT.pairs[i]===t.perm[i]?' stroke="var(--ok)"':'';
    s+='<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="'+(t.colors?4:2.6)+'" stroke-linecap="round"'+okc+' opacity="'+(!printing&&RT.sel===i?1:.9)+'"/>'});
  for(var i=0;i<t.n;i++){var yy=t.y(i),sel=!printing&&RT.sel===i,used=!printing&&RT.pairs[i]!=null;
    s+='<g data-act="lleft" data-i="'+i+'" style="cursor:pointer"><circle cx="26" cy="'+yy+'" r="20" fill="'+(sel?"var(--accent)":used?"var(--accent-soft)":printing?"#fff":"var(--paper)")+'" stroke="'+(printing?"#111":"var(--accent)")+'" stroke-width="2"/>'+
      '<text x="26" y="'+(yy+6)+'" text-anchor="middle" font-size="18" fill="'+(sel?"var(--accent-ink)":printing?"#111":"var(--ink)")+'">'+(i+1)+'</text></g>'}
  for(var j=0;j<t.n;j++){var y2=t.y(j),who=null;if(!printing)for(var k in RT.pairs)if(RT.pairs[k]===j)who=+k;
    s+='<g data-act="lright" data-j="'+j+'" style="cursor:pointer"><rect x="'+(W-48)+'" y="'+(y2-22)+'" width="44" height="44" rx="10" fill="'+(printing?"#fff":"var(--bg)")+'" stroke="'+(printing?"#111":"var(--line)")+'"/>'+
      '<g transform="translate('+(W-44)+','+(y2-18)+') scale(.9)" fill="none" stroke="'+(printing?"#111":"currentColor")+'" stroke-width="2.6">'+SH[t.rights[j]]+'</g>';
    if(printing)s+='<rect x="'+(W-96)+'" y="'+(y2-16)+'" width="32" height="32" fill="#fff" stroke="#111" stroke-width="1.5"/>';
    else if(who!=null)s+='<circle cx="'+(W-80)+'" cy="'+y2+'" r="14" fill="var(--accent)"/><text x="'+(W-80)+'" y="'+(y2+5)+'" text-anchor="middle" font-size="14" fill="var(--accent-ink)">'+(who+1)+'</text>';
    s+='</g>'}
  return s+'</svg>';
}

function streamStage(){
  var st=RT.st,t=RT.task;
  if(!st)return '<button class="stage" data-act="stream-start"><span class="msg">'+tr(UI.start)+'</span></button>';
  if(st.over){var hits=0,miss=0,fa=0,go=0;t.go.forEach(function(g,i){if(g){go++;if(st.resp[i])hits++;else miss++}else if(st.resp[i])fa++});
    return stats([[tr(UI.found),hits+" / "+go,1],[tr(UI.missed),miss],[tr(UI.falseTaps),fa]]);}
  var banner=t.switchAt>=0&&st.i>=t.switchAt?'<span class="banner">'+tr(t.switchText)+'</span>':'';
  return '<button class="stage'+(st.flash?" flash":"")+'" data-act="tap">'+banner+(st.show?shp(t.items[st.i],{color:SHCOL[t.items[st.i]]}):'')+'</button><div class="bar"><i style="width:'+(100*st.i/t.items.length)+'%"></i></div>';
}
function streamStep(){
  var st=RT.st,t=RT.task;
  if(st.i>=t.items.length){st.over=true;refreshTask();return}
  st.show=true;st.flash=false;refreshTask();
  st.timer=setTimeout(function(){st.show=false;refreshTask();st.timer=setTimeout(function(){st.i++;streamStep()},300)},t.ms);
}

function sheetURL(){var base=location.href.split("?")[0].split("#")[0];
  return base+"?print=1&type="+encodeURIComponent(RT.id)+"&lv="+RT.lv+"&seed="+RT.seed+"&alpha="+S.alpha+"&lang="+S.lang+"&age="+S.age}
function fixTop(s){return s.replace("%ORIG%",tr({ru:"Образец",en:"Original"}))}

/* ---- графический диктант ---- */
function dictSVG(t,printing,motifOnly){
  var c=24,W=printing?Math.max(t.W,24):t.W,H=printing?Math.max(t.H,8):t.H,sx=t.sx,sy=printing?Math.floor((H-(t.H-2))/2)+t.sy-1:t.sy;
  var s='<svg class="dsvg" viewBox="0 0 '+(W*c)+' '+(H*c)+'" style="max-width:'+(W*c*1.6)+'px">';
  for(var x=0;x<=W;x++)s+='<line x1="'+x*c+'" y1="0" x2="'+x*c+'" y2="'+H*c+'" class="gl"/>';
  for(var y=0;y<=H;y++)s+='<line x1="0" y1="'+y*c+'" x2="'+W*c+'" y2="'+y*c+'" class="gl"/>';
  s+='<circle cx="'+sx*c+'" cy="'+sy*c+'" r="4.5" class="gdot"/>';
  if(!printing){var px=sx,py=sy,pts=[[px,py]];for(var i=0;i<RT.step;i++){var d=t.units[i];px+=d==="r"?1:d==="l"?-1:0;py+=d==="d"?1:d==="u"?-1:0;pts.push([px,py])}
    s+='<polyline points="'+pts.map(function(p){return p[0]*c+","+p[1]*c}).join(" ")+'" class="gpath"/>'}
  return s+'</svg>'}

/* ---- точки ---- */
function dotsSVG(t,segs,work,printing){
  var n=t.n,c=60,pad=26,S2=(n-1)*c+pad*2,s='<svg class="dotsvg" viewBox="0 0 '+S2+' '+S2+'">';
  function xy(i){return[pad+(i%n)*c,pad+Math.floor(i/n)*c]}
  segs.forEach(function(k){var p=k.split("-").map(Number),a=xy(p[0]),b=xy(p[1]),bad=work&&RT.checked&&t.target.indexOf(k)<0;
    s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" class="'+(bad?"dline bad":"dline")+'"/>'});
  if(work&&RT.checked)t.target.forEach(function(k){if(segs.indexOf(k)<0){var p=k.split("-").map(Number),a=xy(p[0]),b=xy(p[1]);s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" class="dline miss"/>'}});
  for(var i=0;i<n*n;i++){var p2=xy(i);s+=(work?'<g data-act="dot" data-i="'+i+'" style="cursor:pointer"><circle cx="'+p2[0]+'" cy="'+p2[1]+'" r="22" fill="transparent"/>':'<g>')+
    '<circle cx="'+p2[0]+'" cy="'+p2[1]+'" r="'+(work&&RT.dsel===i?9:5.5)+'" class="'+(work&&RT.dsel===i?"ddot sel":"ddot")+'"/></g>'}
  return s+'</svg>'}

/* ---- дорожки и пунктир ---- */
function traceSVG(t,printing){
  var s='<svg class="tsvg" viewBox="0 0 '+t.W+' '+t.H+'"'+(printing?'':' data-trace="1"')+'>';
  t.tracks.forEach(function(tk){var P=poly(tk.pts);
    if(t.dashed)s+='<polyline points="'+P+'" class="tdash"/>';
    else s+='<polyline points="'+P+'" class="tedge" style="stroke-width:'+(tk.w+4)+'"/><polyline points="'+P+'" class="tin" style="stroke-width:'+tk.w+'"/>';
    var a=tk.pts[0],b=tk.pts[tk.pts.length-1];
    if(!t.dashed)s+='<circle cx="'+a[0]+'" cy="'+a[1]+'" r="7" class="tstart"/><g transform="translate('+(b[0]-11)+' '+(b[1]-11)+') scale(.55)" class="tend">'+SH.star+'</g>'});
  if(!printing)s+='<g class="ustroke">'+(RT.strokes||[]).map(function(st){return '<polyline points="'+poly(st)+'"/>'}).join("")+'</g>';
  return s+'</svg>'}
function evalTrace(t){
  var all=[];t.tracks.forEach(function(tk){all=all.concat(tk.pts)});
  var up=[];(RT.strokes||[]).forEach(function(st){up=up.concat(st)});
  if(!up.length)return{acc:0,cov:0};
  var tol=t.tol,inside=0;
  function d2(a,b){var dx=a[0]-b[0],dy=a[1]-b[1];return dx*dx+dy*dy}
  up.forEach(function(p){var m=1e9;for(var i=0;i<all.length;i+=1){var v=d2(p,all[i]);if(v<m)m=v}if(m<=tol*tol)inside++});
  var cov=0;for(var i=0;i<all.length;i+=2){var q=all[i],hit=false;for(var j=0;j<up.length;j++){if(d2(q,up[j])<=tol*tol*1.6){hit=true;break}}if(hit)cov++}
  return{acc:Math.round(100*inside/up.length),cov:Math.min(100,Math.round(100*cov/Math.ceil(all.length/2)))}}
function bindTrace(){
  var sv=document.querySelector('svg[data-trace]');if(!sv||sv._b||!RT||RT.task.kind!=="trace")return;sv._b=1;
  var g=sv.querySelector(".ustroke"),cur=null,line=null;
  function pt(e){var b=sv.getBoundingClientRect();return[(e.clientX-b.left)/b.width*RT.task.W,(e.clientY-b.top)/b.height*RT.task.H]}
  sv.addEventListener("pointerdown",function(e){if(RT.checked)return;if(!RT.t0)RT.t0=Date.now();cur=[pt(e)];RT.strokes.push(cur);line=document.createElementNS("http://www.w3.org/2000/svg","polyline");g.appendChild(line);try{sv.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault()});
  sv.addEventListener("pointermove",function(e){if(!cur)return;cur.push(pt(e));line.setAttribute("points",poly(cur))});
  ["pointerup","pointercancel","pointerleave"].forEach(function(ev){sv.addEventListener(ev,function(){cur=null})});
}

/* ---- память ---- */
function memStage(){
  var t=RT.task,m=RT.mem,R=t.rounds[m.r];
  if(m.phase==="final"){var ok=m.score.filter(Boolean).length;return stats([[tr(UI.rounds),ok+" / "+t.rounds.length,1]])+'<p class="note">'+(ok===t.rounds.length?tr(UI.great):tr(UI.memNote))+'</p>'}
  var head='<div class="memhead"><span>'+tr(UI.round)+' '+(m.r+1)+' / '+t.rounds.length+'</span></div>';
  if(m.phase==="ready")return head+'<button class="stage" data-act="mstart"><span class="msg">'+tr(UI.start)+'</span></button>';
  var body="";
  if(m.phase==="show"){
    if(R.mode==="matrix")body=matrixHTML(R,"show");
    else body='<div class="memrow">'+R.show.map(function(x){return boxed(x)}).join("")+'</div>';
    return head+'<div class="memstage">'+body+'</div><div class="bar"><i class="shrink" style="animation-duration:'+t.ms+'ms"></i></div><div class="actions"><button class="btn ghost" data-act="mready">'+tr(UI.remembered)+'</button></div>';
  }
  if(m.phase==="ask"||m.phase==="fb"){
    var fb=m.phase==="fb";
    if(R.mode==="vanish"){body='<div class="memrow">'+R.rest.map(function(x){return x?boxed(x):'<span class="blank"></span>'}).join("")+'</div><div class="popts">'+
      R.opts.map(function(o,k){var on=m.pick.indexOf(k)>=0,cls=fb?(R.ans.indexOf(k)>=0?" okb":on?" badb":""):on?" selb":"";return '<button data-act="mpick" data-k="'+k+'" class="'+cls+'">'+o+'</button>'}).join("")+'</div>'}
    else if(R.mode==="swap"){body='<div class="memrow">'+R.after.map(function(x,k){var on=m.pick.indexOf(k)>=0,cls=fb?(R.ans.indexOf(k)>=0?" okb":on?" badb":""):on?" selb":"";return '<button class="mbtn'+cls+'" data-act="mpick" data-k="'+k+'">'+x+'</button>'}).join("")+'</div>'}
    else if(R.mode==="matrix")body=matrixHTML(R,fb?"fb":"ask");
    else body='<div class="grid" style="--cols:'+Math.min(R.opts.length,R.opts.length>9?4:3)+';max-width:340px">'+R.opts.map(function(o,k){var on=m.pick.indexOf(k)>=0,cls=fb?(R.ans.indexOf(k)>=0?" okc":on?" r-wrong":""):on?" selc":"";return '<button class="cell big'+cls+'" data-act="mpick" data-k="'+k+'">'+o+'</button>'}).join("")+'</div>';
    var foot=fb?'<p class="note">'+(m.score[m.r]?tr(UI.right):tr(UI.lookAgain))+'</p><div class="memrow small">'+(R.mode==="matrix"?"":R.show.map(function(x){return boxed(x)}).join(""))+'</div><div class="actions"><button class="btn" data-act="mnext">'+tr(UI.next)+'</button></div>'

/* ---- печатные листы для моторики ---- */
function hatchSheet(t){
  var cols=t.small?3:2,cw=t.small?180:260,ch=t.small?170:220,rows=Math.ceil(t.items.length/cols),W=cols*cw,H=rows*ch;
  var s='<svg class="hsvg" viewBox="0 0 '+W+' '+H+'">';
  t.items.forEach(function(it,i){var cx=(i%cols)*cw+cw/2-14,cy=Math.floor(i/cols)*ch+ch/2,sc=t.small?3:4.2;
    s+='<g transform="translate('+cx+' '+cy+') scale('+sc+') translate(-20 -20)" fill="none" stroke="#111" stroke-width="'+(2.4/sc*2)+'">'+SH[it.s]+'</g>';
    var bx=(i%cols)*cw+cw-44,by=Math.floor(i/cols)*ch+16;s+='<rect x="'+bx+'" y="'+by+'" width="32" height="32" fill="#fff" stroke="#111" stroke-width="1.4"/>';
    var L="";for(var k=1;k<6;k++){var o=k*32/6;
      if(it.m==="v"||it.m==="x")L+='M'+(bx+o)+' '+(by+3)+'V'+(by+29);
      if(it.m==="h"||it.m==="x")L+='M'+(bx+3)+' '+(by+o)+'H'+(bx+29);
      if(it.m==="d")L+='M'+(bx+o-6)+' '+(by+30)+'L'+(bx+o+6)+' '+(by+2)}
    if(it.m==="o")for(var a=0;a<3;a++)for(var b2=0;b2<3;b2++)L+='M'+(bx+9+a*8)+' '+(by+9+b2*8)+'m-2.5 0a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0';
    s+='<path d="'+L+'" stroke="#111" stroke-width="1.2" fill="none"/>'});
  return s+'</svg>'}
function gridpatSheet(t){
  var c=20,W=34,out="";
  t.rows.forEach(function(m){var ex=expand(m,2),w=walk(ex.u),H=w.mxy-w.mny+3,sx=1-w.mnx,sy=1-w.mny;
    var s='<svg class="dsvg" viewBox="0 0 '+(W*c)+' '+(H*c)+'">';
    for(var x=0;x<=W;x++)s+='<line x1="'+x*c+'" y1="0" x2="'+x*c+'" y2="'+H*c+'" class="gl"/>';
    for(var y=0;y<=H;y++)s+='<line x1="0" y1="'+y*c+'" x2="'+W*c+'" y2="'+y*c+'" class="gl"/>';
    s+='<polyline points="'+w.pts.map(function(p){return (p[0]+sx)*c+","+(p[1]+sy)*c}).join(" ")+'" class="gpath print"/>';
    out+=s+'</svg>'});
  return out}

  $("printzone").innerHTML=h;
  return top+'<div class="sheetwrap">'+h+'</div>';

/* ---- Занятие дня ---- */
function buildSession(){
  var seed=newSeed(),r=rng(seed);
  var all=blk().types,pool=all.filter(function(id){return S.format!=="print"||TYPES[id].formats.indexOf("print")>=0});if(pool.length<2)pool=all;
  if(S.format!=="print"){var sc=pool.filter(function(id){return TYPES[id].formats.indexOf("screen")>=0});if(sc.length>=2)pool=sc.concat(pool.filter(function(id){return sc.indexOf(id)<0}).slice(0,1))}
  // недавние типы уходят в конец очереди
  var fresh=shuffle(r,pool.filter(function(id){return S.recent.indexOf(id)<0})),old=pool.filter(function(id){return S.recent.indexOf(id)>=0}).sort(function(a,b){return S.recent.indexOf(b)-S.recent.indexOf(a)});
  var order=fresh.concat(old),a=order[0],b=order[1];
  var games=gamesFor(S.age),g=games.length?pick(r,games):"warm";
  var la=levelFor(a,S.age,S.diff),lb=levelFor(b,S.age,S.diff);
  // не больше двух уровней за занятие
  if(Math.abs(la-lb)>1)lb=la+(lb>la?1:-1);lb=clamp(lb,0,TYPES[b].levels.length-1);
  var easyType=pool.filter(function(id){return id!==b})[Math.floor(r()*(pool.length-1))]||a;
  var le=clamp(Math.min(levelFor(easyType,S.age,S.diff),la)-1,0,TYPES[easyType].levels.length-1);
  S.recent=[a,b].concat(S.recent.filter(function(x){return x!==a&&x!==b})).slice(0,4);store.set("nz-recent",JSON.stringify(S.recent));
  S.session={idx:0,tip:Math.floor(r()*TIPS.ru.length),steps:[
   {k:"warm",seed:newSeed()},{k:"task",id:a,lv:la,seed:newSeed()},{k:"move",id:g,seed:newSeed()},{k:"task",id:b,lv:lb,seed:newSeed()},{k:"task",id:easyType,lv:le,seed:newSeed(),final:1}]};
  enterStep();
}
function enterStep(){var st=S.session.steps[S.session.idx];if(st.k==="task")startTask(st.id,st.lv,st.seed,modeFor(st.id));else stopStream()}
function renderSessionTab(){
  if(!S.session)buildSession();
  var s=S.session,st=s.steps[s.idx];
  var labels=[tr(UI.stWarm),tr(UI.stTask)+" 1",tr(UI[blk().moveLabel]),tr(UI.stTask)+" 2",tr(UI.stFinal)];
  var h='<div class="steps">'+labels.map(function(l,i){return '<button data-act="step" data-v="'+i+'"'+(i===s.idx?' aria-current="step"':'')+(i<s.idx?' class="past"':'')+'><i>'+(i+1)+'</i>'+l+'</button>'}).join("")+'</div>';
  h+='<p class="note">'+tr(UI.sessMeta)+'</p>';
  h+='<section class="card">';
  if(st.k==="warm")h+=moveCard("warm",st.seed);
  else if(st.k==="move")h+=moveCard(st.id,st.seed);
  else{if(!RT||RT.seed!==st.seed)startTask(st.id,st.lv,st.seed,modeFor(st.id));
    h+=(st.final?'<p class="note">'+tr(UI.finalNote)+'</p>':'')+taskHead(false)+'<div id="taskbody">'+renderTaskBody()+'</div>'}
  h+='</section>';
  if(s.idx===2||s.idx===4)h+='<div class="tip"><b>'+tr(UI.tip)+'</b>'+TIPS[S.lang][(s.tip+s.idx)%TIPS.ru.length]+'</div>';
  if(s.idx===4)h+='<p class="note">'+tr(UI.sessDone)+'</p>';
  h+='<div class="actions">'+(s.idx>0?'<button class="btn ghost" data-act="sprev">'+tr(UI.prev)+'</button>':'')+(s.idx<4?'<button class="btn" data-act="snext">'+tr(UI.next)+'</button>':'')+'<button class="btn ghost" data-act="snew" style="margin-left:auto">'+tr(UI.newSession)+'</button></div>';
  return h;
}

   case "age":S.age=+v;store.set("nz-age",v);S.session=null;if(S.cur)startTask(S.cur,levelFor(S.cur,S.age,S.diff),newSeed(),modeFor(S.cur));render();break;

   case "format":S.format=v;store.set("nz-format",v);if(RT){RT.mode=modeFor(RT.id)}S.session=null;render();break;
   case "alpha":S.alpha=v;store.set("nz-alpha",v);if(RT)regenTaskSameType(RT.seed);render();break;
   case "tab":S.tab=v;stopStream();if(v==="tasks"&&S.cur)startTask(S.cur,levelFor(S.cur,S.age,S.diff),newSeed(),modeFor(S.cur));if(v==="session"&&S.session)enterStep();render();break;
   case "pick":S.cur=v;startTask(v,levelFor(v,S.age,S.diff),newSeed(),modeFor(v));render();window.scrollTo&&window.scrollTo(0,0);break;
   case "cat":S.cur=null;stopStream();render();break;
   case "lv":var nl=clamp(RT.lv+(+v),0,TYPES[RT.id].levels.length-1);startTask(RT.id,nl,newSeed(),RT.mode);if(S.tab==="session"){var cs=S.session.steps[S.session.idx];cs.lv=nl;cs.seed=RT.seed}render();break;
   case "new":regenTaskSameType(newSeed());render();break;
   case "again":regenTaskSameType(RT.seed);render();break;
   case "speak":speak();break;
   case "print":window.print();break;
   case "tool":RT.tool=v;document.querySelectorAll('[data-act="tool"]').forEach(function(x){x.setAttribute("aria-pressed",x===b)});break;
   case "cell":if(RT.checked)return;if(!RT.t0)RT.t0=Date.now();var i=+b.dataset.i,tool=RT.task.tools.length===1?RT.task.tools[0]:RT.tool;
     RT.marks[i]=RT.marks[i]===tool?null:tool;b.querySelector(".mark").innerHTML=RT.marks[i]?MARK[RT.marks[i]]:"";break;
   case "done":RT.elapsed=RT.t0?Date.now()-RT.t0:0;RT.checked=true;refreshTask();break;
   case "ord":if(RT.checked)return;if(!RT.t0)RT.t0=Date.now();var c=RT.task.cells[+b.dataset.i];
     if(c.ord===RT.next){RT.next++;if(RT.next===RT.task.total){RT.checked=true;RT.elapsed=Date.now()-RT.t0}refreshTask()}else if(c.ord>RT.next){RT.errors++;wobble(b)}break;
   case "opt":if(!RT.t0)RT.t0=Date.now();var ri=+b.dataset.r,row=RT.task.rows[ri];
     if(+b.dataset.k===row.ans){RT.answers[ri]=1;if(Object.keys(RT.answers).length===RT.task.rows.length){RT.checked=true;RT.elapsed=Date.now()-RT.t0}refreshTask()}else{RT.errors++;wobble(b)}break;
   case "lleft":if(RT.checked)return;if(!RT.t0)RT.t0=Date.now();RT.sel=+b.dataset.i;refreshTask();break;
   case "lright":if(RT.checked||RT.sel==null)return;var j=+b.dataset.j;for(var k in RT.pairs)if(RT.pairs[k]===j)delete RT.pairs[k];RT.pairs[RT.sel]=j;RT.sel=null;refreshTask();break;
   case "stream-start":RT.st={i:0,resp:{},show:false,flash:false,over:false,timer:null};streamStep();break;
   case "tap":var st=RT.st;if(!st||st.over||!st.show)return;st.resp[st.i]=true;st.flash=true;refreshTask();break;
   case "move":S.moveId=v;S.moveSeed=newSeed();render();break;
   case "move-new":S.moveSeed=newSeed();render();break;
   case "step":S.session.idx=+v;enterStep();render();break;
   case "snext":S.session.idx=Math.min(4,S.session.idx+1);enterStep();render();window.scrollTo&&window.scrollTo(0,0);break;
   case "sprev":S.session.idx=Math.max(0,S.session.idx-1);enterStep();render();break;
   case "snew":buildSession();render();break;
  }
});
var rz;window.addEventListener("resize",function(){clearTimeout(rz);rz=setTimeout(function(){var g=document.querySelector('[data-g]');if(g&&RT&&RT.task.cols)g.style.setProperty("--cols",screenCols(RT.task.cols))},150)});

/* ---- параметры адреса: ?block=memory&lang=en&single=1 ---- */
(function(){try{var q=new URLSearchParams(location.search),b=q.get("block"),l=q.get("lang");
 if(b&&BLOCKS.some(function(x){return x.id===b}))S.block=b;
 if(l==="ru"||l==="en")S.lang=l;
 if(q.get("single")==="1")document.documentElement.classList.add("single");
 if(q.get("print")==="1"){var ty=q.get("type"),al=q.get("alpha"),ag=+q.get("age");
  if(al==="ru"||al==="en")S.alpha=al; if(ag>=3&&ag<=12)S.age=ag;
  if(TYPES[ty]&&TYPES[ty].formats.indexOf("print")>=0){var lv=clamp(+q.get("lv")||0,0,TYPES[ty].levels.length-1),sd=+q.get("seed")||newSeed();
   BLOCKS.some(function(bk){if(bk.types.indexOf(ty)>=0){S.block=bk.id;return true}});
   S.format="print";S.tab="tasks";S.cur=ty;startTask(ty,lv,sd,"print");document.documentElement.classList.add("printpage");
   window.addEventListener("load",function(){setTimeout(function(){try{window.print()}catch(e){}},700)});}}}catch(e){}})();
/* ---- высота для вставки в сайт: сообщаем окну сайта свою высоту ---- */
(function(){if(window.parent===window)return;var last=0;function send(){var h=Math.ceil(document.body.getBoundingClientRect().height)+4;if(Math.abs(h-last)>2){last=h;try{window.parent.postMessage({nzHeight:h},"*")}catch(e){}}}
 try{new ResizeObserver(send).observe(document.body)}catch(e){setInterval(send,700)}window.addEventListener("load",send);setTimeout(send,300)})();
window.__nz={TYPES:TYPES,rng:rng,GAMES:GAMES,levelFor:levelFor,S:S};
render();
