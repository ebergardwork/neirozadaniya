function streamStage(){
  var st=RT.st,t=RT.task;
  if(!st)return '<button class="stage" data-act="stream-start"><span class="msg">'+tr(UI.start)+'</span></button>';
  if(st.over){var hits=0,miss=0,fa=0,go=0;t.go.forEach(function(g,i){if(g){go++;if(st.resp[i])hits++;else miss++}else if(st.resp[i])fa++});
    return stats([[tr(UI.found),hits+" / "+go,1],[tr(UI.missed),miss],[tr(UI.falseTaps),fa]],miss===0&&fa===0);}
  var banner=t.switchAt>=0&&st.i>=t.switchAt?'<span class="banner">'+tr(t.switchText)+'</span>':'';
  return '<button class="stage'+(st.flash?" flash":"")+'" data-act="tap">'+banner+(st.show?shp(t.items[st.i],{color:SHCOL[t.items[st.i]]}):'')+'</button><div class="bar"><i style="width:'+(100*st.i/t.items.length)+'%"></i></div>';
}
function streamStep(){
  var st=RT.st,t=RT.task;
  if(st.i>=t.items.length){st.over=true;refreshTask();return}
  st.show=true;st.flash=false;refreshTask();
  st.timer=setTimeout(function(){st.show=false;refreshTask();st.timer=setTimeout(function(){st.i++;streamStep()},300)},t.ms);
}

/* ---- графический диктант ---- */
function dictSVG(t,printing,motifOnly){
  var c=24,W=printing?Math.max(t.W,24):t.W,H=printing?Math.max(t.H,8):t.H,sx=t.sx,sy=printing?Math.floor((H-(t.H-2))/2)+t.sy-1:t.sy;
  var s='<svg class="dsvg" viewBox="0 0 '+(W*c)+' '+(H*c)+'" style="max-width:'+(W*c*1.6)+'px">';
  for(var x=0;x<=W;x++)s+='<line x1="'+x*c+'" y1="0" x2="'+x*c+'" y2="'+H*c+'" class="gl"/>';
  for(var y=0;y<=H;y++)s+='<line x1="0" y1="'+y*c+'" x2="'+W*c+'" y2="'+y*c+'" class="gl"/>';
  s+='<circle cx="'+sx*c+'" cy="'+sy*c+'" r="4.5" class="gdot"/>';
  if(!printing){var px=sx,py=sy,pts=[[px,py]];for(var i=0;i<RT.step;i++){var d=t.units[i];px+=d==="r"?1:d==="l"?-1:0;py+=d==="d"?1:d==="u"?-1:0;pts.push([px,py])}
    s+='<polyline points="'+pts.map(function(p){return p[0]*c+","+p[1]*c}).join(" ")+'" class="gpath"/>'}
  return s+'</svg>'}

/* ---- точки ---- */
function dotsSVG(t,segs,work,printing,role){
  var n=t.n,c=60,pad=26,S2=(n-1)*c+pad*2,s='<svg class="dotsvg" viewBox="0 0 '+S2+' '+S2+'">';
  function xy(i){return[pad+(i%n)*c,pad+Math.floor(i/n)*c]}
  segs.forEach(function(k){var p=k.split("-").map(Number),a=xy(p[0]),b=xy(p[1]),bad=work&&RT.checked&&t.target.indexOf(k)<0;
    s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" class="'+(bad?"dline bad":"dline")+'"/>'});
  if(work&&RT.checked)t.target.forEach(function(k){if(segs.indexOf(k)<0){var p=k.split("-").map(Number),a=xy(p[0]),b=xy(p[1]);s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" class="dline miss"/>'}});
  var st0=role==="s"?t.start:(role==="y"?(t.mirror?Math.floor(t.start/n)*n+(n-1-t.start%n):t.start):null);
  if(st0!=null&&st0!==undefined){var ps0=xy(st0);s+='<circle cx="'+ps0[0]+'" cy="'+ps0[1]+'" r="13" class="dstart"/>'}
  for(var i=0;i<n*n;i++){var p2=xy(i);s+=(work?'<g data-act="dot" data-i="'+i+'" style="cursor:pointer"><circle cx="'+p2[0]+'" cy="'+p2[1]+'" r="22" fill="transparent"/>':'<g>')+
    '<circle cx="'+p2[0]+'" cy="'+p2[1]+'" r="'+(work&&RT.dsel===i?9:5.5)+'" class="'+(work&&RT.dsel===i?"ddot sel":"ddot")+'"/></g>'}
  return s+'</svg>'}

/* ---- дорожки и пунктир ---- */
function traceSVG(t,printing){
  var s='<svg class="tsvg" viewBox="0 0 '+t.W+' '+t.H+'"'+(printing?'':' data-trace="1"')+'>';
  t.tracks.forEach(function(tk){var P=poly(tk.pts);
    if(t.dashed)s+='<polyline points="'+P+'" class="tdash"/>';
    else s+='<polyline points="'+P+'" class="tedge" style="stroke-width:'+(tk.w+4)+'"/><polyline points="'+P+'" class="tin" style="stroke-width:'+tk.w+'"/>';
    var a=tk.pts[0],b=tk.pts[tk.pts.length-1];
    if(!t.dashed)s+='<circle cx="'+a[0]+'" cy="'+a[1]+'" r="7" class="tstart"/><g transform="translate('+(b[0]-11)+' '+(b[1]-11)+') scale(.55)" class="tend">'+SH.star+'</g>'});
  if(!printing)s+='<g class="ustroke">'+(RT.strokes||[]).map(function(st){return '<polyline points="'+poly(st)+'"/>'}).join("")+'</g>';
  return s+'</svg>'}
function evalTrace(t){
  var all=[];t.tracks.forEach(function(tk){all=all.concat(tk.pts)});
  var up=[];(RT.strokes||[]).forEach(function(st){up=up.concat(st)});
  if(!up.length)return{acc:0,cov:0};
  var tol=t.tol,inside=0;
  function d2(a,b){var dx=a[0]-b[0],dy=a[1]-b[1];return dx*dx+dy*dy}
  up.forEach(function(p){var m=1e9;for(var i=0;i<all.length;i+=1){var v=d2(p,all[i]);if(v<m)m=v}if(m<=tol*tol)inside++});
  var cov=0;for(var i=0;i<all.length;i+=2){var q=all[i],hit=false;for(var j=0;j<up.length;j++){if(d2(q,up[j])<=tol*tol*1.6){hit=true;break}}if(hit)cov++}
  return{acc:Math.round(100*inside/up.length),cov:Math.min(100,Math.round(100*cov/Math.ceil(all.length/2)))}}
function bindTrace(){
  var sv=document.querySelector('svg[data-trace]');if(!sv||sv._b||!RT||RT.task.kind!=="trace")return;sv._b=1;
  var g=sv.querySelector(".ustroke"),cur=null,line=null;
  function pt(e){var b=sv.getBoundingClientRect();return[(e.clientX-b.left)/b.width*RT.task.W,(e.clientY-b.top)/b.height*RT.task.H]}
  sv.addEventListener("pointerdown",function(e){if(RT.checked)return;if(!RT.t0)RT.t0=Date.now();cur=[pt(e)];RT.strokes.push(cur);line=document.createElementNS("http://www.w3.org/2000/svg","polyline");g.appendChild(line);try{sv.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault()});
  sv.addEventListener("pointermove",function(e){if(!cur)return;cur.push(pt(e));line.setAttribute("points",poly(cur))});
  ["pointerup","pointercancel","pointerleave"].forEach(function(ev){sv.addEventListener(ev,function(){cur=null})});
}

/* ---- память ---- */
function memStage(){
  var t=RT.task,m=RT.mem,R=t.rounds[m.r];
  if(m.phase==="final"){var ok=m.score.filter(Boolean).length;return stats([[tr(UI.rounds),ok+" / "+t.rounds.length,1]],ok===t.rounds.length)+'<p class="note">'+(ok===t.rounds.length?tr(UI.great):tr(UI.memNote))+'</p>'}
  var head='<div class="memhead"><span>'+tr(UI.round)+' '+(m.r+1)+' / '+t.rounds.length+'</span></div>';
  if(m.phase==="ready")return head+'<button class="stage" data-act="mstart"><span class="msg">'+tr(UI.start)+'</span></button>';
  var body="";
  if(m.phase==="show"){
    if(R.mode==="matrix")body=matrixHTML(R,"show");
    else body='<div class="memrow">'+R.show.map(function(x){return boxed(x)}).join("")+'</div>';
    return head+'<div class="memstage">'+body+'</div><div class="bar"><i class="shrink" style="animation-duration:'+t.ms+'ms"></i></div><div class="actions"><button class="btn ghost" data-act="mready">'+tr(UI.remembered)+'</button></div>';
  }
  if(m.phase==="ask"||m.phase==="fb"){
    var fb=m.phase==="fb";
    if(R.mode==="vanish"){body='<div class="memrow">'+R.rest.map(function(x){return x?boxed(x):'<span class="blank"></span>'}).join("")+'</div><div class="popts">'+
      R.opts.map(function(o,k){var on=m.pick.indexOf(k)>=0,cls=fb?(R.ans.indexOf(k)>=0?" okb":on?" badb":""):on?" selb":"";return '<button data-act="mpick" data-k="'+k+'" class="'+cls+'">'+o+'</button>'}).join("")+'</div>'}
    else if(R.mode==="swap"){body='<div class="memrow">'+R.after.map(function(x,k){var on=m.pick.indexOf(k)>=0,cls=fb?(R.ans.indexOf(k)>=0?" okb":on?" badb":""):on?" selb":"";return '<button class="mbtn'+cls+'" data-act="mpick" data-k="'+k+'">'+x+'</button>'}).join("")+'</div>'}
    else if(R.mode==="matrix")body=matrixHTML(R,fb?"fb":"ask");
    else body='<div class="grid" style="--cols:'+Math.min(R.opts.length,R.opts.length>9?4:3)+';max-width:340px">'+R.opts.map(function(o,k){var on=m.pick.indexOf(k)>=0,cls=fb?(R.ans.indexOf(k)>=0?" okc":on?" r-wrong":""):on?" selc":"";return '<button class="cell big'+cls+'" data-act="mpick" data-k="'+k+'">'+o+'</button>'}).join("")+'</div>';
    var foot=fb?'<p class="note">'+(m.score[m.r]?tr(UI.right):tr(UI.lookAgain))+'</p><div class="memrow small">'+(R.mode==="matrix"?"":R.show.map(function(x){return boxed(x)}).join(""))+'</div><div class="actions"><button class="btn" data-act="mnext">'+tr(UI.next)+'</button></div>'
      :(R.mode==="recall"?'<div class="actions"><button class="btn" data-act="mcheck">'+tr(UI.done)+'</button></div>':'');
    return head+'<div class="memstage">'+body+'</div>'+foot;
  }

function hatchSheet(t){
  var cols=t.small?3:2,cw=t.small?180:260,ch=t.small?170:220,rows=Math.ceil(t.items.length/cols),W=cols*cw,H=rows*ch;
  var s='<svg class="hsvg" viewBox="0 0 '+W+' '+H+'">';
  t.items.forEach(function(it,i){var cx=(i%cols)*cw+cw/2-14,cy=Math.floor(i/cols)*ch+ch/2,sc=t.small?3:4.2;
    s+='<g transform="translate('+cx+' '+cy+') scale('+sc+') translate(-20 -20)" fill="none" stroke="#111" stroke-width="'+(2.4/sc*2)+'">'+SH[it.s]+'</g>';
    var bx=(i%cols)*cw+cw-44,by=Math.floor(i/cols)*ch+16;s+='<rect x="'+bx+'" y="'+by+'" width="32" height="32" fill="#fff" stroke="#111" stroke-width="1.4"/>';
    var L="";for(var k=1;k<6;k++){var o=k*32/6;
      if(it.m==="v"||it.m==="x")L+='M'+(bx+o)+' '+(by+3)+'V'+(by+29);
      if(it.m==="h"||it.m==="x")L+='M'+(bx+3)+' '+(by+o)+'H'+(bx+29);
      if(it.m==="d")L+='M'+(bx+o-6)+' '+(by+30)+'L'+(bx+o+6)+' '+(by+2)}
    if(it.m==="o")for(var a=0;a<3;a++)for(var b2=0;b2<3;b2++)L+='M'+(bx+9+a*8)+' '+(by+9+b2*8)+'m-2.5 0a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0';
    s+='<path d="'+L+'" stroke="#111" stroke-width="1.2" fill="none"/>'});
  return s+'</svg>'}
function gridpatSheet(t){
  var c=20,W=34,out="";
  t.rows.forEach(function(m){var ex=expand(m,2),w=walk(ex.u),H=w.mxy-w.mny+3,sx=1-w.mnx,sy=1-w.mny;
    var s='<svg class="dsvg" viewBox="0 0 '+(W*c)+' '+(H*c)+'">';
    for(var x=0;x<=W;x++)s+='<line x1="'+x*c+'" y1="0" x2="'+x*c+'" y2="'+H*c+'" class="gl"/>';
    for(var y=0;y<=H;y++)s+='<line x1="0" y1="'+y*c+'" x2="'+W*c+'" y2="'+y*c+'" class="gl"/>';
    s+='<polyline points="'+w.pts.map(function(p){return (p[0]+sx)*c+","+(p[1]+sy)*c}).join(" ")+'" class="gpath print"/>';
    out+=s+'</svg>'});
  return out}

function buildSession(){
  var seed=newSeed(),r=rng(seed);
  var all=blk().types,pool=all.filter(function(id){return S.format!=="print"||TYPES[id].formats.indexOf("print")>=0});if(pool.length<2)pool=all;
  if(S.format!=="print"){var sc=pool.filter(function(id){return TYPES[id].formats.indexOf("screen")>=0});if(sc.length>=2)pool=sc.concat(pool.filter(function(id){return sc.indexOf(id)<0}).slice(0,1))}
  // недавние типы уходят в конец очереди
  var fresh=shuffle(r,pool.filter(function(id){return S.recent.indexOf(id)<0})),old=pool.filter(function(id){return S.recent.indexOf(id)>=0}).sort(function(a,b){return S.recent.indexOf(b)-S.recent.indexOf(a)});
  var order=fresh.concat(old),a=order[0],b=order[1];
  var games=gamesFor(S.age),g=games.length?pick(r,games):"warm";
  var la=levelFor(a,S.age,S.diff),lb=levelFor(b,S.age,S.diff);
  // не больше двух уровней за занятие
  if(Math.abs(la-lb)>1)lb=la+(lb>la?1:-1);lb=clamp(lb,0,TYPES[b].levels.length-1);
  var easyType=pool.filter(function(id){return id!==b})[Math.floor(r()*(pool.length-1))]||a;
  var le=clamp(Math.min(levelFor(easyType,S.age,S.diff),la)-1,0,TYPES[easyType].levels.length-1);
  S.recent=[a,b].concat(S.recent.filter(function(x){return x!==a&&x!==b})).slice(0,4);store.set("nz-recent",JSON.stringify(S.recent));
  var steps=[{k:"warm",seed:newSeed()},{k:"task",id:a,lv:la,seed:newSeed()},{k:"move",id:g,seed:newSeed()},{k:"task",id:b,lv:lb,seed:newSeed()}];
  // с 7 лет: ещё одно задание из другой функции (блока), чем функция дня
  var used=[a,b,easyType];
  function otherPool(){var cur=blk().id,fmt=S.format==="print"?"print":"screen",out=[];
    BLOCKS.forEach(function(B){if(B.id===cur)return;B.types.forEach(function(id){if(used.indexOf(id)<0&&out.indexOf(id)<0&&TYPES[id]&&TYPES[id].formats.indexOf(fmt)>=0)out.push(id)})});return out}
  if(S.age>=7){var op=otherPool();if(op.length){var ex=pick(r,op);used.push(ex);steps.push({k:"task",id:ex,lv:levelFor(ex,S.age,S.diff),seed:newSeed(),extra:1})}}
  steps.push({k:"task",id:easyType,lv:le,seed:newSeed(),final:1});
  // с 9 лет: необязательный бонус после финала, на уровень сложнее
  if(S.age>=9){var bp=otherPool().filter(function(id){return used.indexOf(id)<0});if(bp.length){var bo=pick(r,bp);steps.push({k:"task",id:bo,lv:clamp(levelFor(bo,S.age,S.diff)+1,0,TYPES[bo].levels.length-1),seed:newSeed(),bonus:1})}}
  var fi=0;steps.forEach(function(x,i){if(x.final)fi=i});
  S.session={idx:0,finalIdx:fi,tip:Math.floor(r()*TIPS.ru.length),steps:steps};
  enterStep();
}

  return h;
