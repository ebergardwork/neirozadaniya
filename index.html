body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.nz{max-width:980px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.nz *{box-sizing:border-box}
.nz button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.nz button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.nz h1,.nz h2,.nz h3{margin:0;text-wrap:balance;line-height:1.2}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:nowrap}
.top>div:first-child{min-width:0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,4vw,30px);margin-top:4px!important}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:11px;font-weight:500;font-size:14px;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:14px 20px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:680px){.panel{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field>span{font-size:13px;color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-width:42px;min-height:40px;border:1px solid var(--line);background:var(--bg);border-radius:10px;font-weight:500;font-variant-numeric:tabular-nums}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nav{display:flex;gap:6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.nav button{border:0;background:transparent;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;min-height:44px}
.nav button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.head h2{font-family:var(--display);font-weight:500;font-size:20px}
.head .meta{color:var(--muted);font-size:13px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper span{font-size:13px;color:var(--muted);min-width:0}
.rule{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.rule p{margin:0;font-size:clamp(17px,2.4vw,20px);font-weight:500;flex:1 1 260px;min-width:0;text-wrap:balance}
.samples{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sample{display:flex;align-items:center;gap:6px;background:var(--accent-soft);border-radius:12px;padding:6px 10px}
.arrow{color:var(--muted);font-size:18px}
.box{position:relative;display:grid;place-items:center;width:38px;height:38px;flex:none}
.box .sym{width:100%;height:100%;font-size:24px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 16px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.btn svg{width:18px;height:18px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.variant{color:var(--muted);font-size:13px;margin-left:auto;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:5px 12px 5px 6px;min-height:50px;font-weight:500}
.tools button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sym{display:grid;place-items:center;color:var(--ink);font-weight:500;line-height:1}
.sym svg{width:100%;height:100%;overflow:visible}
.mark{position:absolute;inset:0;pointer-events:none;color:var(--accent)}
.mark svg{width:100%;height:100%}
.grid{display:grid;gap:4px;grid-template-columns:repeat(var(--cols),minmax(0,1fr))}
.grid,.mgrid2{margin-inline:auto}
.pseq,.popts{justify-content:center}
.prow .refgrid,.prow .mgrid{margin-inline:auto}
.prow .mgrid{width:max-content;max-width:100%}
.cell{position:relative;aspect-ratio:1;border:0;background:var(--bg);border-radius:9px;padding:0;display:grid;place-items:center;min-width:0}
.cell .sym{width:72%;height:72%;font-size:clamp(16px,3.4vw,28px)}
.cell.big .sym{font-size:clamp(20px,5vw,36px)}
.cell.done{background:var(--ok-soft)}
.cell.done .sym{opacity:.45}
.cell.r-miss{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.cell.r-wrong{background:var(--wrong-soft);box-shadow:inset 0 0 0 2px var(--wrong)}
.cell.r-wrong .mark{color:var(--wrong)}
.c-red{color:var(--red)!important}
.divider{grid-column:1/-1;display:flex;align-items:center;gap:10px;color:var(--accent);font-weight:600;font-size:14px;padding:6px 0;flex-wrap:wrap}
.divider::before,.divider::after{content:"";flex:1;border-top:2px dashed currentColor;opacity:.6;min-width:20px}
@keyframes wob{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:no-preference){.wob{animation:wob .3s}}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{font-family:var(--display);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.stat.ok b{color:var(--ok)}
.note{font-size:13px;color:var(--muted);margin:0}
.prow{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:14px;background:var(--bg)}
.pseq{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pseq .box{width:44px;height:44px}
.blank{width:44px;height:44px;border:2px dashed var(--muted);border-radius:10px;position:relative;display:grid;place-items:center}
.blank.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.popts{display:flex;gap:8px;flex-wrap:wrap}
.popts button{width:56px;height:56px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:6px;display:grid;place-items:center}
.lines{width:100%;height:auto;display:block;touch-action:manipulation}
.lines text{font-family:var(--body);font-weight:600}
.stage{position:relative;height:min(52vh,360px);border-radius:20px;background:var(--bg);display:grid;place-items:center;border:0;width:100%;padding:0}
.stage .sym{width:min(42vw,180px);height:min(42vw,180px)}
.stage.flash{box-shadow:inset 0 0 0 6px var(--accent)}
.stage .msg{font-size:18px;font-weight:600;padding:16px;text-align:center;max-width:32ch}
.banner{position:absolute;top:12px;left:12px;right:12px;text-align:center;font-weight:600;color:var(--accent);font-size:14px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tcard{border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px}
.tcard b{font-weight:600;font-size:16px}
.tcard small{color:var(--muted);font-size:13px}
.tcard .tags{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.tag{font-size:11px;letter-spacing:.04em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);padding:3px 7px;border-radius:6px;font-weight:600}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;min-height:36px;display:flex;gap:6px;align-items:center}
.steps button[aria-current="step"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.steps button.past{color:var(--muted)}
.steps i{font-style:normal;font-variant-numeric:tabular-nums;opacity:.7}
.mlist{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.mlist li{padding-left:4px}
.mlist small{color:var(--muted)}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chiprow span{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-weight:500;font-variant-numeric:tabular-nums}
.chiprow span.hl{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tip{background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:14px}
.tip b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.fly{display:grid;gap:3px;width:150px;grid-template-columns:repeat(var(--n),1fr)}
.fly span{aspect-ratio:1;background:var(--bg);border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:13px}
.foot{font-size:12px;color:var(--muted);text-align:center;max-width:70ch;margin:0 auto}
/* печатный лист */
.sheetwrap{overflow-x:auto}
.sheet{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:26px;max-width:794px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sheet .shead{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.sheet .shead span{flex:1 1 140px;border-bottom:1px solid #111;padding-bottom:2px;min-width:0}
.sheet .srule{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:17px;font-weight:500}
.sheet .sample{background:#eee}
.sheet .sym,.sheet .mark,.sheet .divider{color:#111}
.sheet .c-red{color:#c0392b!important}
.sheet .sgrid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:6px 4px}
.sheet .scell{aspect-ratio:1;display:grid;place-items:center;position:relative}
.sheet .scell .sym{width:74%;height:74%;font-size:clamp(14px,2.8vw,26px)}
.sheet .scell.boxed{border:1.5px solid #111}
.sheet .prow{background:transparent;border-bottom:1px solid #ddd;border-radius:0}
.sheet .blank{border-color:#111}
.sheet .sfoot{font-size:11px;color:#666;display:flex;justify-content:space-between;gap:10px}
.sheet .lines text{fill:#111}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  .nz>*{display:none!important}
  .nz>.printzone{display:block!important}
  .printzone .sheet{border:0;padding:0;max-width:none;break-after:page}
}
.printzone{display:none}
.nz .btn{color:var(--accent-ink);text-decoration:none}
.nz .btn.ghost{color:var(--accent)}
.single #blocks{display:none}
.printpage .top,.printpage #panel,.printpage #blocks,.printpage #nav,.printpage .head,.printpage #foot,.printpage [data-act="new"],.printpage .variant,.printpage .card>.note{display:none!important}
.printpage .card{border:0;background:transparent;padding:0}
.blocks{display:flex;gap:8px;flex-wrap:wrap}
.blocks button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;min-height:42px}
.blocks button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ns *{vector-effect:non-scaling-stroke}
.topfig{display:flex;flex-direction:column;align-items:center;gap:8px}
.bigpic{width:min(60vw,220px);height:auto;color:var(--ink)}
.pairlabel{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center}
.refgrid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:4px;width:100%;max-width:calc(var(--cols)*62px)}
.rcell{aspect-ratio:1;display:grid;place-items:center;background:var(--bg);border-radius:8px}
.rcell .sym{width:70%;height:70%}
.grid.rows{row-gap:14px}
.mgrid{display:grid;grid-template-columns:repeat(var(--g),58px);gap:4px}
.mcell{width:58px;height:58px;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);border-radius:8px}
.mcell .sym{width:80%;height:80%}
.mcell.blank{border:2px dashed var(--muted);background:transparent}
.mcell.blank.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.popts button .sym,.popts .qopt .sym{width:100%;height:100%}
.qopt{display:inline-flex;align-items:center;gap:4px;width:64px;height:50px}
.qopt b{font-size:13px}
.spool{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;padding:10px;border-radius:14px;background:var(--bg)}
.sitem{width:58px;height:58px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:6px;display:grid;place-items:center}
.sitem.small{width:44px;height:44px;padding:4px}
.sitem.sel{border:2.5px solid var(--accent);background:var(--accent-soft)}
.sitem.bad{border:2px solid var(--wrong);background:var(--wrong-soft)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bin{border:2px dashed var(--line);border-radius:16px;padding:10px;min-height:120px;display:flex;flex-direction:column;gap:8px;cursor:pointer;background:var(--paper)}
.binlab{width:44px;height:44px;display:grid;place-items:center;margin:0 auto}
.binlab .sym{width:100%;height:100%}
.binitems{display:flex;flex-wrap:wrap;gap:6px}
.swatch{width:36px;height:36px;border-radius:50%;display:block}
.memhead{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:500}
.memstage{min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;border-radius:20px;background:var(--bg)}
.memrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.memrow .box,.memrow .blank{width:56px;height:56px}
.memrow.small .box{width:36px;height:36px}
.mbtn{width:60px;height:60px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:6px;display:grid;place-items:center}
.selb{border:2.5px solid var(--accent)!important;background:var(--accent-soft)!important}
.okb{border:2.5px solid var(--ok)!important;background:var(--ok-soft)!important}
.badb{border:2.5px solid var(--wrong)!important;background:var(--wrong-soft)!important}
.cell.lit{background:var(--accent)}.cell.lit .sym{color:var(--accent-ink)}
.cell.selc{background:var(--accent-soft);box-shadow:inset 0 0 0 2.5px var(--accent)}
.cell.okc{background:var(--ok-soft);box-shadow:inset 0 0 0 2.5px var(--ok)}
.mgrid2{max-width:320px;width:100%}
.mgrid2 .cell .sym{font-size:22px}
@keyframes shrink{from{width:100%}to{width:0}}
.bar i.shrink{animation:shrink linear forwards}
.arrows{display:flex;gap:10px;justify-content:center}
.arrows button{width:64px;height:64px;border-radius:16px;border:1.5px solid var(--line);background:var(--paper);font-size:28px;font-weight:600}
.dsvg{width:100%;height:auto;display:block;margin:0 auto}
.dsvg .gl{stroke:var(--line);stroke-width:1}
.dsvg .gdot{fill:var(--accent)}
.dsvg .gpath{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.chiprow span.past{opacity:.45}
.pboard{max-width:360px;width:100%;margin:0 auto}
.pboard .cell{border:1.5px solid var(--line)}
.dotpair{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.dotpair>div{flex:1 1 200px;max-width:300px;display:flex;flex-direction:column;gap:6px}
.dotsvg{width:100%;height:auto;max-width:300px}
.dotsvg .ddot{fill:var(--ink)}.dotsvg .ddot.sel{fill:var(--accent)}
.dotsvg .dline{stroke:var(--accent);stroke-width:5;stroke-linecap:round}
.dotsvg .dline.bad{stroke:var(--wrong)}
.dotsvg .dline.miss{stroke:var(--accent);stroke-dasharray:6 7;opacity:.6}
.tsvg{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.tsvg polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}
.tsvg .tedge{stroke:var(--ink)}.tsvg .tin{stroke:var(--paper)}
.tsvg .tdash{stroke:var(--muted);stroke-width:2.4;stroke-dasharray:6 7}
.tsvg .tstart{fill:var(--accent)}.tsvg .tend{fill:var(--accent);stroke:none}
.tsvg .ustroke polyline{stroke:var(--accent);stroke-width:4;opacity:.85}
.hsvg{width:100%;height:auto}
.dtext{font-size:20px;font-weight:600;letter-spacing:.04em;margin:0;font-variant-numeric:tabular-nums;word-spacing:6px}
.sheet .dsvg .gl{stroke:#bbb}.sheet .dsvg .gdot{fill:#111}.sheet .dsvg .gpath{stroke:#111}
.sheet .tsvg .tedge{stroke:#111}.sheet .tsvg .tin{stroke:#fff}.sheet .tsvg .tdash{stroke:#777}.sheet .tsvg .tstart,.sheet .tsvg .tend{fill:#111}
.dotsvg .dstart{fill:none;stroke:var(--accent);stroke-width:3}.sheet .dotsvg .dstart{stroke:#111;stroke-width:2.2}
.sheet .dotsvg .ddot{fill:#111}.sheet .dotsvg .dline{stroke:#111}
.sheet .mcell{background:#fff;border-color:#999}
.sheet .refgrid .rcell,.sheet .rcell{background:#fff;border:1px solid #ddd}
.sheet .bigpic{color:#111}
.sheet .pboard .scell{border:1.5px solid #111}


/* ===== Зимняя тема и зайка Нико (с 1 декабря по 28/29 февраля) ===== */
:root.winter{--bg:#eaf2fa;--paper:#ffffff;--ink:#1d2b40;--muted:#5b6b82;--line:#d2e0ee;--accent:#2b5f99;--accent-soft:#e0ecf8;--accent-ink:#ffffff}
@media (prefers-color-scheme: dark){:root.winter:not([data-theme="light"]){--bg:#121a26;--paper:#1b2533;--ink:#e8eef6;--muted:#9fb0c6;--line:#2c3a4e;--accent:#8fbcef;--accent-soft:#22324a;--accent-ink:#0f1722}}
:root.winter[data-theme="dark"]{--bg:#121a26;--paper:#1b2533;--ink:#e8eef6;--muted:#9fb0c6;--line:#2c3a4e;--accent:#8fbcef;--accent-soft:#22324a;--accent-ink:#0f1722}
:root.winter body{background-color:var(--bg);background-image:radial-gradient(circle at 12px 18px,rgba(255,255,255,.95) 1.6px,transparent 2.4px),radial-gradient(circle at 70px 64px,rgba(255,255,255,.8) 1.2px,transparent 2px),radial-gradient(circle at 110px 30px,rgba(255,255,255,.7) 1px,transparent 1.8px);background-size:140px 110px}
@media (prefers-color-scheme: dark){:root.winter:not([data-theme="light"]) body{background-image:radial-gradient(circle at 12px 18px,rgba(255,255,255,.18) 1.6px,transparent 2.4px),radial-gradient(circle at 70px 64px,rgba(255,255,255,.12) 1.2px,transparent 2px)}}
.vlab[hidden]{display:none}
.vlab{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.vsel{min-height:40px;max-width:220px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);padding:4px 8px;font:inherit}
@media print{.vlab{display:none!important}}
.week{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:10px 14px;margin:8px 0}
.week .wmsg{display:flex;flex-direction:column;gap:2px;font-size:15px;min-width:0}.week .wmsg span{font-size:13px;color:var(--muted)}
.wdays{display:flex;gap:6px}.wd{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.wd .dot{width:30px;height:30px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-weight:700;color:var(--accent-ink)}
.wd.on .dot{border:0;background:var(--accent-soft)}.wd.on .dot img{height:22px}
:root:not(.winter) .wd.on .dot{background:var(--accent)}
.wd.today .wn{color:var(--ink);font-weight:700}.wd.today .dot{border-color:var(--accent);border-style:solid}
@media print{.week{display:none!important}}
.sym img.pic{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none}
.sym img.pic.sm{transform:scale(.6)}
.calmbtn{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 12px;min-height:40px;font-size:14px}
.calmbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toprt{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;flex:none}
@media(max-width:480px){.top{flex-wrap:wrap}.toprt{margin-left:auto}}
.langmenu{position:relative;display:flex;align-items:center}

.niko{display:flex;align-items:flex-end;gap:12px;margin:2px 0 4px}

.niko .say{position:relative;background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:10px 14px;margin-bottom:22px;font-size:16px;line-height:1.4;max-width:46ch;min-width:0}
.niko .say:before{content:"";position:absolute;left:-9px;bottom:14px;width:14px;height:14px;background:var(--paper);border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:rotate(45deg)}
.niko.mini img{height:84px}.niko.mini .say{margin-bottom:12px;font-size:15px}

 :root.winter:not(.calm) .niko img{animation:nkin .5s ease-out both,nkbreathe 4.5s ease-in-out .5s infinite}

}

pa punktēto līniju", "Figuren en schrijfpatronen volgen langs de stippellijn"], "Две большие фигуры": ["Zwei große Figuren", "Дві великі фігури", "Divas lielas figūras", "Twee grote figuren"], "Ряд фигур": ["Eine Reihe Figuren", "Ряд фігур", "Figūru rinda", "Een rij figuren"], "Палочки, кружки, волна": ["Striche, Kreise, Welle", "Палички, кружечки, хвиля", "Svītriņas, aplīši, vilnis", "Streepjes, cirkels, golf"], "Крючки, петли, зигзаг": ["Haken, Schleifen, Zickzack", "Гачки, петлі, зигзаг", "Āķīši, cilpas, zigzags", "Haakjes, lussen, zigzag"], "Длинные узоры письма": ["Lange Schreibmuster", "Довгі візерунки письма", "Gari rakstīšanas raksti", "Lange schrijfpatronen"], "Штриховка": ["Schraffieren", "Штрихування", "Svītrošana", "Arceren"], "Заштриховать фигуры в нужном направлении, не выходя за контур": ["Figuren in der vorgegebenen Richtung schraffieren, ohne über die Umrisse zu malen", "Заштрихувати фігури в потрібному напрямку, не виходячи за контур", "Svītrot figūras norādītajā virzienā, neiziejot ārpus kontūras", "Figuren in de juiste richting arceren zonder buiten de omtrek te komen"], "Две фигуры, сверху вниз": ["Zwei Figuren, von oben nach unten", "Дві фігури, зверху вниз", "Divas figūras, no augšas uz leju", "Twee figuren, van boven naar beneden"], "Вертикально и горизонтально": ["Senkrecht und waagerecht", "Вертикально й горизонтально", "Vertikāli un horizontāli", "Verticaal en horizontaal"], "Добавляется наискосок": ["Schräg kommt dazu", "Додається навскіс", "Pievienojas slīpi", "Schuin komt erbij"], "Кружочки и клетка": ["Kringel und Gitter", "Кружечки й клітинка", "Aplīši un rūtiņas", "Krullen en ruitjes"], "Шесть фигур, разные способы": ["Sechs Figuren, verschiedene Arten", "Шість фігур, різні способи", "Sešas figūras, dažādi veidi", "Zes figuren, verschillende manieren"], "Продолжи узор": ["Setze das Muster fort", "Продовж візерунок", "Turpini rakstu", "Zet het patroon voort"], "Продолжить узор по клеточкам до конца строки": ["Ein Muster auf kariertem Papier bis zum Zeilenende fortsetzen", "Продовжити візерунок за клітинками до кінця рядка", "Turpināt rakstu pa rūtiņām līdz rindas beigām", "Een patroon op ruitjespapier voortzetten tot het einde van de regel"], "Простые ступеньки": ["Einfache Stufen", "Прості сходинки", "Vienkārši pakāpieni", "Eenvoudige trapjes"], "Короткие узоры": ["Kurze Muster", "Короткі візерунки", "Īsi raksti", "Korte patronen"], "Узоры подлиннее": ["Längere Muster", "Довші візерунки", "Garāki raksti", "Langere patronen"], "Шаги до трёх клеток": ["Schritte bis zu drei Kästchen", "Кроки до трьох клітинок", "Soļi līdz trim rūtiņām", "Stappen tot drie hokjes"], "Восприятие и пространство": ["Wahrnehmung und Raum", "Сприйняття й простір", "Uztvere un telpa", "Waarneming en ruimte"], "Внимание": ["Aufmerksamkeit", "Увага", "Uzmanība", "Aandacht"], "Память": ["Gedächtnis", "Пам’ять", "Atmiņa", "Geheugen"], "Мышление": ["Denken", "Мислення", "Domāšana", "Denken"], "Моторика и графомоторика": ["Feinmotorik und Schreibvorbereitung", "Моторика й графомоторика", "Smalkā motorika un rakstīšanas sagatavošana", "Motoriek en schrijfmotoriek"], "Запрещённое движение": ["Verbotene Bewegung", "Заборонений рух", "Aizliegtā kustība", "Verboden beweging"], "Вы показываете движения, ребёнок повторяет всё, кроме запрещённых. Показывайте в спокойном темпе, иногда подряд, иногда с паузой.": ["Sie zeigen Bewegungen, und das Kind macht alle nach, außer den verbotenen. Bleiben Sie in ruhigem Tempo, mal hintereinander, mal mit Pause.", "Ви показуєте рухи, а дитина повторює всі, крім заборонених. Показуйте в спокійному темпі, іноді поспіль, іноді з паузою.", "Jūs rādāt kustības, un bērns atkārto visas, izņemot aizliegtās. Rādiet mierīgā tempā, dažreiz pēc kārtas, dažreiz ar pauzi.", "Jij laat bewegingen zien en je kind doet ze allemaal na, behalve de verboden. Blijf in een rustig tempo, soms achter elkaar, soms met een pauze."], "Хлопки-сигналы": ["Klatsch-Signale", "Хлопки-сигнали", "Plaukšķu signāli", "Klapsignalen"], "Договоритесь, что значит каждый сигнал. Вы хлопаете, ребёнок выполняет действие. Можно меняться ролями.": ["Vereinbaren Sie, was jedes Signal bedeutet. Sie klatschen, das Kind führt die Handlung aus. Man kann die Rollen tauschen.", "Домовтеся, що означає кожен сигнал. Ви плескаєте, дитина виконує дію. Можна помінятися ролями.", "Vienojieties, ko nozīmē katrs signāls. Jūs plaukšķināt, bērns izpilda darbību. Varat mainīties lomām.", "Spreek af wat elk signaal betekent. Jij klapt, het kind voert de handeling uit. Jullie kunnen van rol wisselen."], "Ловлю — не ловлю": ["Fangen oder nicht", "Ловлю — не ловлю", "Ķeru vai neķeru", "Vangen of niet"], "Бросайте мяч и называйте слово. Если слово подходит под правило, ребёнок ловит мяч, если нет — отбивает или прячет руки.": ["Werfen Sie einen Ball und nennen Sie ein Wort. Passt das Wort zur Regel, fängt das Kind den Ball; wenn nicht, wehrt es ihn ab oder versteckt die Hände.", "Кидайте м’яч і називайте слово. Якщо слово підходить під правило, дитина ловить м’яч, якщо ні — відбиває або ховає руки.", "Metiet bumbu un nosauciet vārdu. Ja vārds atbilst noteikumam, bērns bumbu ķer, ja nē — atsit atpakaļ vai paslēpj rokas.", "Gooi een bal en noem een woord. Past het woord bij de regel, dan vangt het kind de bal; zo niet, dan slaat het de bal weg of verstopt het de handen."], "Муха": ["Die Fliege", "Муха", "Muša", "De vlieg"], "Муха сидит в центре поля. Вы говорите, куда она перелетает, ребёнок следит в уме. Малышам можно двигать фишку по нарисованному полю, старшим — без опоры.": ["Die Fliege sitzt in der Mitte des Feldes. Sie sagen, wohin sie fliegt, das Kind verfolgt es im Kopf. Kleinere Kinder können einen Stein auf einem gezeichneten Feld bewegen, ältere ohne Hilfe.", "Муха сидить у центрі поля. Ви кажете, куди вона перелітає, дитина стежить подумки. Малюкам можна пересувати фішку по намальованому полю, старшим — без опори.", "Muša sēž laukuma vidū. Jūs sakāt, kurp tā pārlido, bērns seko tai prātā. Mazākie var pārbīdīt žetonu pa uzzīmētu laukumu, vecākie — bez atbalsta.", "De vlieg zit midden op het bord. Jij zegt waar hij heen vliegt, het kind volgt hem in gedachten. Kleinere kinderen kunnen een steentje over een getekend bord schuiven, oudere kinderen doen het zonder hulpmiddel."], "Светофор": ["Ampel", "Світлофор", "Luksofors", "Stoplicht"], "Показывайте цветной предмет или карточку. Каждый цвет — своё действие. Начинайте медленно, потом ускоряйтесь.": ["Zeigen Sie einen farbigen Gegenstand oder eine Karte. Jede Farbe bedeutet eine Handlung. Fangen Sie langsam an, dann werden Sie schneller.", "Показуйте кольоровий предмет або картку. Кожен колір — своя дія. Починайте повільно, потім прискорюйтеся.", "Rādiet krāsainu priekšmetu vai kartīti. Katra krāsa nozīmē savu darbību. Sāciet lēni, tad paātriniet.", "Laat een gekleurd voorwerp of kaartje zien. Elke kleur is een andere handeling. Begin langzaam en ga dan sneller."], "Схема тела": ["Körperschema", "Схема тіла", "Ķermeņa shēma", "Lichaamsschema"], "Вы называете команду, ребёнок показывает на себе. Начинайте медленно. Если ребёнок путается, станьте рядом лицом в ту же сторону, а не напротив.": ["Sie nennen eine Anweisung, das Kind zeigt es an seinem eigenen Körper. Fangen Sie langsam an. Wenn das Kind durcheinanderkommt, stellen Sie sich neben es in dieselbe Richtung, nicht gegenüber.", "Ви називаєте команду, дитина показує на собі. Починайте повільно. Якщо дитина плутається, станьте поруч обличчям в той самий бік, а не навпроти.", "Jūs nosaucat komandu, bērns parāda to uz sevis. Sāciet lēni. Ja bērns jaucas, nostājieties blakus ar seju uz to pašu pusi, nevis pretī.", "Jij noemt een opdracht, het kind laat het op zijn eigen lichaam zien. Begin langzaam. Raakt het kind in de war, ga dan naast het kind staan, met je gezicht dezelfde kant op, en niet tegenover."], "Робот": ["Roboter", "Робот", "Robots", "Robot"], "Ребёнок — робот. Вы даёте команды по одной, робот выполняет точно и только по команде. Потом можно поменяться ролями.": ["Das Kind ist ein Roboter. Sie geben die Befehle einzeln, der Roboter führt sie genau und nur auf Befehl aus. Danach können Sie die Rollen tauschen.", "Дитина — робот. Ви даєте команди по одній, робот виконує точно й лише за командою. Потім можна помінятися ролями.", "Bērns ir robots. Jūs dodat komandas pa vienai, robots izpilda tās precīzi un tikai pēc komandas. Pēc tam varat mainīties lomām.", "Het kind is een robot. Jij geeft de commando's één voor één, de robot voert ze precies en alleen op commando uit. Daarna kunnen jullie van rol wisselen."], "Цепочка слов": ["Wortkette", "Ланцюжок слів", "Vārdu ķēde", "Woordketting"], "Вы говорите слово, ребёнок повторяет его и добавляет своё. Потом вы повторяете оба и добавляете третье. Цепочка растёт, пока кто-то не собьётся.": ["Sie sagen ein Wort, das Kind wiederholt es und fügt ein eigenes hinzu. Dann wiederholen Sie beide und fügen ein drittes hinzu. Die Kette wächst, bis sich jemand verhaspelt.", "Ви кажете слово, дитина повторює його й додає своє. Потім ви повторюєте обидва й додаєте третє. Ланцюжок росте, поки хтось не помилиться.", "Jūs sakāt vārdu, bērns to atkārto un pievieno savu. Tad jūs atkārtojat abus un pievienojat trešo. Ķēde aug, līdz kāds sajūk.", "Jij zegt een woord, het kind herhaalt het en voegt er een toe. Dan herhaal jij beide en voeg je een derde toe. De ketting groeit totdat iemand de draad kwijtraakt."], "Повтори за мной": ["Sag es nach", "Повтори за мною", "Atkārto pēc manis", "Zeg het na"], "Произнесите ряд спокойно, примерно по одному слову в секунду. Ребёнок повторяет. Если получилось два раза подряд, переходите к ряду длиннее.": ["Sprechen Sie die Reihe ruhig, etwa ein Wort pro Sekunde. Das Kind wiederholt sie. Wenn es zweimal hintereinander klappt, gehen Sie zu einer längeren Reihe über.", "Вимовте ряд спокійно, приблизно по одному слову на секунду. Дитина повторює. Якщо вийшло двічі поспіль, переходьте до довшого ряду.", "Izrunājiet rindu mierīgi, apmēram viens vārds sekundē. Bērns atkārto. Ja divreiz pēc kārtas izdodas, pārejiet uz garāku rindu.", "Zeg de rij rustig op, ongeveer één woord per seconde. Het kind herhaalt. Lukt het twee keer achter elkaar, ga dan naar een langere rij."], "Пиктограммы": ["Bildzeichen", "Піктограми", "Piktogrammas", "Pictogrammen"], "Вы называете слово или фразу, ребёнок рисует быстрый значок, который поможет вспомнить. Не буквы и не красивый рисунок, а подсказку. Через час или вечером ребёнок по рисункам вспоминает слова.": ["Sie nennen ein Wort oder einen Satz, das Kind zeichnet schnell ein Zeichen, das beim Erinnern hilft. Keine Buchstaben und kein schönes Bild, nur eine Gedächtnisstütze. Nach einer Stunde oder am Abend erinnert sich das Kind anhand der Zeichnungen an die Wörter.", "Ви називаєте слово чи фразу, дитина малює швидкий значок, який допоможе згадати. Не літери й не гарний малюнок, а підказку. Через годину чи ввечері дитина за малюнками згадує слова.", "Jūs nosaucat vārdu vai frāzi, bērns uzzīmē ātru zīmīti, kas palīdzēs atcerēties. Nevis burtus un nevis skaistu zīmējumu, bet norādi. Pēc stundas vai vakarā bērns pēc zīmējumiem atceras vārdus.", "Jij noemt een woord of zin, het kind tekent snel een teken dat helpt om het te onthouden. Geen letters en geen mooie tekening, maar een geheugensteun. Na een uur of 's avonds onthoudt het kind de woorden aan de hand van de tekeningen."], "Вечерний разговор": ["Abendgespräch", "Вечірня розмова", "Vakara saruna", "Avondgesprek"], "Вечером спокойно поговорите о прошедшем дне. Если ребёнок не помнит, дайте опору: «Мы сначала пошли… а потом…»": ["Sprechen Sie am Abend ruhig über den vergangenen Tag. Wenn sich das Kind nicht erinnert, geben Sie einen Anhaltspunkt: „Zuerst sind wir … gegangen, und dann …“", "Ввечері спокійно поговоріть про минулий день. Якщо дитина не пам’ятає, допоможіть: «Спочатку ми пішли… а потім…»", "Vakarā mierīgi parunājiet par aizvadīto dienu. Ja bērns neatceras, dodiet atbalstu: „Vispirms mēs aizgājām… un tad…”", "Praat 's avonds rustig over de afgelopen dag. Weet het kind het niet meer, geef dan een steuntje: „Eerst gingen we naar … en daarna …”"], "Назови одним словом": ["Mit einem Wort nennen", "Назви одним словом", "Nosauc vienā vārdā", "Noem het met één woord"], "Вы называете три предмета, ребёнок находит общее слово. Старшим можно наоборот: вы называете группу, ребёнок перечисляет пять её представителей.": ["Sie nennen drei Dinge, das Kind findet das gemeinsame Wort. Bei älteren Kindern auch umgekehrt: Sie nennen eine Gruppe, das Kind zählt fünf Beispiele auf.", "Ви називаєте три предмети, дитина знаходить спільне слово. Старшим можна навпаки: ви називаєте групу, дитина перелічує п’ять її представників.", "Jūs nosaucat trīs priekšmetus, bērns atrod kopīgo vārdu. Vecākajiem var otrādi: jūs nosaucat grupu, bērns uzskaita piecus tās pārstāvjus.", "Jij noemt drie dingen, het kind zoekt het gemeenschappelijke woord. Bij oudere kinderen ook andersom: jij noemt een groep, het kind noemt er vijf voorbeelden van."], "Чем похожи, чем отличаются": ["Was ist gleich, was ist anders", "Чим схожі, чим відрізняються", "Kas kopīgs, kas atšķirīgs", "Wat is gelijk, wat is anders"], "Назовите пару. Ребёнок говорит, чем предметы похожи и чем отличаются. Хвалите за каждую найденную идею.": ["Nennen Sie ein Paar. Das Kind sagt, was die Dinge gemeinsam haben und worin sie sich unterscheiden. Loben Sie jede Idee, die es findet.", "Назвіть пару. Дитина говорить, чим предмети схожі й чим відрізняються. Хваліть за кожну знайдену ідею.", "Nosauciet pāri. Bērns saka, kas priekšmetiem kopīgs un ar ko tie atšķiras. Uzslavējiet par katru atrasto ideju.", "Noem een paar. Het kind zegt waarin de dingen op elkaar lijken en waarin ze verschillen. Prijs elk idee dat het vindt."], "Что сначала, что потом": ["Was kommt zuerst, was danach", "Що спочатку, що потім", "Kas vispirms, kas pēc tam", "Wat eerst, wat daarna"], "Назовите события вперемешку. Ребёнок расставляет их по порядку и объясняет почему.": ["Nennen Sie Ereignisse durcheinander. Das Kind ordnet sie der Reihe nach und erklärt, warum.", "Назвіть події впереміш. Дитина розставляє їх по порядку й пояснює чому.", "Nosauciet notikumus jaukti. Bērns sakārto tos pēc kārtas un paskaidro, kāpēc.", "Noem gebeurtenissen door elkaar. Het kind zet ze op volgorde en legt uit waarom."], "Упражнения для рук": ["Übungen für die Hände", "Вправи для рук", "Rokām paredzēti vingrinājumi", "Oefeningen voor de handen"], "Сделайте два-три упражнения с тем, что есть дома, прежде чем брать карандаш.": ["Machen Sie zwei oder drei Übungen mit Dingen, die Sie zu Hause haben, bevor Sie zum Stift greifen.", "Зробіть дві-три вправи з тим, що є вдома, перш ніж братися за олівець.", "Izpildiet divus vai trīs vingrinājumus ar to, kas ir mājās, pirms ķerties pie zīmuļa.", "Doe twee of drie oefeningen met spulletjes die je thuis hebt, voordat je naar het potlood grijpt."], "Кулак — ребро — ладонь": ["Faust – Kante – Handfläche", "Кулак — ребро — долоня", "Dūre — mala — plauksta", "Vuist – zijkant – handpalm"], "Покажите положения руки на столе и попросите повторять по порядку без пауз. Сначала вместе, потом сам. Если сбивается, проговаривайте вслух.": ["Zeigen Sie die Handstellungen auf dem Tisch und bitten Sie das Kind, sie der Reihe nach ohne Pausen zu wiederholen. Erst zusammen, dann allein. Wenn es sich verhaspelt, sprechen Sie die Wörter laut mit.", "Покажіть положення руки на столі й попросіть повторювати по порядку без пауз. Спочатку разом, потім самому. Якщо збивається, промовляйте вголос.", "Parādiet rokas stāvokļus uz galda un palūdziet atkārtot pēc kārtas bez pauzēm. Vispirms kopā, tad pašam. Ja jaucas, izrunājiet skaļi.", "Laat de handstanden op tafel zien en vraag het kind ze op volgorde en zonder pauzes te herhalen. Eerst samen, dan alleen. Raakt het de draad kwijt, zeg de woorden dan hardop mee."], "Пальчики здороваются": ["Finger sagen Hallo", "Пальчики вітаються", "Pirkstiņi sasveicinās", "Vingers zeggen hallo"], "Большой палец по очереди касается кончиков остальных пальцев. Следите, чтобы касания были чёткими и по порядку.": ["Der Daumen berührt nacheinander die Spitzen der anderen Finger. Achten Sie auf deutliche Berührungen in der richtigen Reihenfolge.", "Великий палець по черзі торкається кінчиків інших пальців. Стежте, щоб дотики були чіткими й по порядку.", "Īkšķis pēc kārtas pieskaras pārējo pirkstu galiem. Raugieties, lai pieskārieni būtu skaidri un pēc kārtas.", "De duim raakt om de beurt de toppen van de andere vingers aan. Let op duidelijke aanrakingen in de goede volgorde."], "Домашние животные": ["Haus- und Nutztiere", "Домашні тварини", "Mājdzīvnieki", "Huisdieren en boerderijdieren"], "Дикие животные": ["Wilde Tiere", "Дикі тварини", "Savvaļas dzīvnieki", "Wilde dieren"], "Птицы": ["Vögel", "Птахи", "Putni", "Vogels"], "Насекомые": ["Insekten", "Комахи", "Kukaiņi", "Insecten"], "Рыбы и морские жители": ["Fische und Meerestiere", "Риби й морські мешканці", "Zivis un jūras dzīvnieki", "Vissen en zeedieren"], "Овощи": ["Gemüse", "Овочі", "Dārzeņi", "Groenten"], "Фрукты": ["Obst", "Фрукти", "Augļi", "Fruit"], "Ягоды": ["Beeren", "Ягоди", "Ogas", "Bessen"], "Продукты": ["Lebensmittel", "Продукти", "Pārtika", "Eten en drinken"], "Посуда": ["Geschirr und Küchengeräte", "Посуд", "Trauki un virtuves piederumi", "Servies en keukengerei"], "Мебель": ["Möbel", "Меблі", "Mēbeles", "Meubels"], "Одежда": ["Kleidung", "Одяг", "Apģērbs", "Kleding"], "Обувь и головные уборы": ["Schuhe und Kopfbedeckungen", "Взуття й головні убори", "Apavi un galvassegas", "Schoenen en hoofddeksels"], "Игрушки": ["Spielzeug", "Іграшки", "Rotaļlietas", "Speelgoed"], "Транспорт": ["Verkehrsmittel", "Транспорт", "Transports", "Vervoer"], "Профессии": ["Berufe", "Професії", "Profesijas", "Beroepen"], "Инструменты": ["Werkzeuge", "Інструменти", "Instrumenti", "Gereedschap"], "Бытовая техника": ["Haushaltsgeräte", "Побутова техніка", "Sadzīves tehnika", "Huishoudelijke apparaten"], "Части тела": ["Körperteile", "Частини тіла", "Ķermeņa daļas", "Lichaamsdelen"], "Погода и природа": ["Wetter und Natur", "Погода й природа", "Laikapstākļi un daba", "Weer en natuur"], "Деревья": ["Bäume", "Дерева", "Koki", "Bomen"], "Цветы": ["Blumen", "Квіти", "Ziedi", "Bloemen"], "Музыкальные инструменты": ["Musikinstrumente", "Музичні інструменти", "Mūzikas instrumenti", "Muziekinstrumenten"], "Школьные принадлежности": ["Schulsachen", "Шкільне приладдя", "Skolas piederumi", "Schoolspullen"], "Спорт": ["Sport", "Спорт", "Sports", "Sport"], "Дом": ["Zuhause", "Дім", "Māja", "Thuis"], "Сег.": ["Heute", "Сьог.", "Šodien", "Vandaag"], "Сегодня ты занимался — отлично!": ["Heute hast du geübt – super!", "Сьогодні заняття вже було — чудово!", "Šodien tu darbojies — lieliski!", "Vandaag heb je geoefend – super!"], "Сегодня ещё можно позаниматься": ["Heute ist noch Zeit zum Üben", "Сьогодні ще можна позайматися", "Šodien vēl ir laiks nodarboties", "Vandaag kun je nog oefenen"], "Здесь будут отмечаться дни занятий": ["Hier erscheinen deine Übungstage", "Тут відзначатимуться дні занять", "Šeit tiks atzīmētas tavas nodarbību dienas", "Hier verschijnen je oefendagen"], "Дни занятий за последнюю неделю": ["Übungstage der letzten Woche", "Дні занять за останній тиждень", "Nodarbību dienas pēdējā nedēļā", "Oefendagen van de afgelopen week"], "Всего дней с занятиями: ": ["Tage mit Übungen insgesamt: ", "Усього днів із заняттями: ", "Kopā dienu ar nodarbībām: ", "Aantal dagen met oefeningen: "], "В корзинке у Нико: ": ["In Nikos Körbchen: ", "У кошику в Ніко: ", "Niko grozā: ", "In het mandje van Niko: "], "Посмотри на ряд и нарисуй в пустой клетке, что будет дальше.": ["Schau dir die Reihe an und zeichne ins leere Kästchen, was als Nächstes kommt.", "Подивись на ряд і намалюй у порожній клітинці, що буде далі.", "Paskaties uz rindu un uzzīmē tukšajā rūtiņā, kas sekos tālāk.", "Kijk naar de rij en teken in het lege hokje wat er daarna komt."], "Проследи глазами каждую линию и напиши её номер в клеточке у фигуры, где она заканчивается.": ["Folge jeder Linie mit den Augen und schreibe ihre Nummer in das Kästchen bei der Figur, an der sie endet.", "Простеж очима кожну лінію й напиши її номер у клітинці біля фігури, де вона закінчується.", "Izseko ar acīm katrai līnijai un ieraksti tās numuru rūtiņā pie figūras, kurā tā beidzas.", "Volg elke lijn met je ogen en schrijf het nummer in het hokje bij de figuur waar de lijn eindigt."], "Нарисуй фигуры на поле так, как сказано.": ["Zeichne die Figuren so aufs Feld, wie es gesagt wird.", "Намалюй фігури на полі так, як сказано.", "Uzzīmē figūras laukumā tā, kā teikts.", "Teken de figuren op het bord, zoals er gezegd wordt."], "Нарисуй узор на пустых точках зеркально.": ["Zeichne das Muster auf den leeren Punkten spiegelverkehrt.", "Намалюй візерунок на порожніх точках дзеркально.", "Uzzīmē rakstu uz tukšajiem punktiem spoguļattēlā.", "Teken het patroon gespiegeld op de lege stippen."], "Срисуй узор на пустых точках.": ["Zeichne das Muster auf den leeren Punkten ab.", "Змалюй візерунок на порожніх точках.", "Pārzīmē rakstu uz tukšajiem punktiem.", "Teken het patroon over op de lege stippen."], "Какая фигура должна стоять в пустой клетке? Обведи ответ.": ["Welche Figur gehört ins leere Kästchen? Kreise die Antwort ein.", "Яка фігура має стояти в порожній клітинці? Обведи відповідь.", "Kurai figūrai jāstāv tukšajā rūtiņā? Apvelc atbildi.", "Welke figuur hoort in het lege hokje? Omcirkel het antwoord."], " Нажми на картинку, а потом на коробку.": [" Tippe auf ein Bild und dann auf eine Box.", " Натисни на картинку, а потім на коробку.", " Pieskaries bildītei, tad kastei.", " Tik op een plaatje en dan op een doos."], "В каждой коробке уже лежит одна фигура. Догадайся, по какому правилу раскладывать, и разложи остальные.": ["In jeder Box liegt schon eine Figur. Finde heraus, nach welcher Regel du sortieren sollst, und sortiere den Rest.", "У кожній коробці вже лежить одна фігура. Здогадайся, за яким правилом розкладати, і розклади решту.", "Katrā kastē jau ir viena figūra. Uzmini, pēc kāda noteikuma jāšķiro, un sašķiro pārējās.", "In elke doos ligt al één figuur. Bedenk volgens welke regel je moet sorteren en sorteer de rest."], " Нажми на фигуру, а потом на коробку.": [" Tippe auf eine Figur und dann auf eine Box.", " Натисни на фігуру, а потім на коробку.", " Pieskaries figūrai, tad kastei.", " Tik op een figuur en dan op een doos."], "Проведи карандашом по каждой дорожке от точки до звёздочки, не выходя за края и не отрывая руки.": ["Fahre mit dem Stift jeden Weg entlang, vom Punkt bis zum Stern, ohne über den Rand zu kommen und ohne abzusetzen.", "Проведи олівцем по кожній доріжці від точки до зірочки, не виходячи за краї й не відриваючи руки.", "Ved ar zīmuli pa katru celiņu no punkta līdz zvaigznītei, neiziejot ārpus malām un nepaceļot roku.", "Ga met je potlood langs elk pad, van het stipje tot de ster, zonder buiten de randen te komen en zonder op te tillen."], "Обведи карандашом каждую линию по пунктиру, стараясь не отрывать руку.": ["Fahre mit dem Stift jede gepunktete Linie nach und versuche, nicht abzusetzen.", "Обведи олівцем кожну лінію за пунктиром, намагаючись не відривати руку.", "Apvelc ar zīmuli katru punktēto līniju, mēģinot nepacelt roku.", "Volg met je potlood elke stippellijn en probeer niet op te tillen."], "Нельзя повторять: ": ["Nicht nachmachen: ", "Не повторювати: ", "Nedrīkst atkārtot: ", "Niet nadoen: "], "Порядок движений для вас (выделены ловушки):": ["Reihenfolge der Bewegungen für Sie (Fallen hervorgehoben):", "Порядок рухів для вас (виділено пастки):", "Kustību secība jums (lamatas izceltas):", "Volgorde van de bewegingen voor jou (valkuilen gemarkeerd):"], "Последовательность сигналов:": ["Reihenfolge der Signale:", "Послідовність сигналів:", "Signālu secība:", "Volgorde van de signalen:"], "Слова по порядку (выделены те, что ловим):": ["Wörter der Reihe nach (hervorgehoben sind die, die gefangen werden):", "Слова по порядку (виділено ті, що ловимо):", "Vārdi pēc kārtas (izcelti tie, kurus ķeram):", "Woorden op volgorde (gemarkeerd zijn de woorden die we vangen):"], "Ходы:": ["Züge:", "Ходи:", "Gājieni:", "Zetten:"], "Покажи ": ["Zeige ", "Покажи ", "Parādi ", "Laat zien: "], "Встань напротив меня и покажи мою правую руку": ["Stell dich mir gegenüber und zeige meine rechte Hand", "Стань навпроти мене й покажи мою праву руку", "Nostājies man pretī un parādi manu labo roku", "Ga tegenover me staan en wijs mijn rechterhand aan"], "Усложнение: назовите все команды сразу, а робот выполнит их по памяти.": ["Schwieriger: Sagen Sie alle Befehle auf einmal, und der Roboter führt sie aus dem Gedächtnis aus.", "Ускладнення: назвіть усі команди одразу, а робот виконає їх по пам’яті.", "Sarežģījums: nosauciet visas komandas uzreiz, un robots tās izpildīs no atmiņas.", "Moeilijker: noem alle commando's in één keer en de robot voert ze uit het hoofd uit."], "Тема: ": ["Thema: ", "Тема: ", "Tēma: ", "Thema: "], "начните с цепочки из ": ["beginnen Sie mit einer Kette aus ", "почніть із ланцюжка з ", "sāciet ar ķēdi no ", "begin met een ketting van "], "Слова-подсказки для вас:": ["Wortideen für Sie:", "Слова-підказки для вас:", "Vārdu idejas jums:", "Woordideeën voor jou:"], "Усложнение: попросите повторить ряд в обратном порядке.": ["Schwieriger: Bitten Sie das Kind, die Reihe rückwärts zu wiederholen.", "Ускладнення: попросіть повторити ряд у зворотному порядку.", "Sarežģījums: palūdziet atkārtot rindu pretējā secībā.", "Moeilijker: vraag het kind om de rij achterstevoren te herhalen."], "Потом другой рукой. ": ["Danach mit der anderen Hand. ", "Потім іншою рукою. ", "Pēc tam ar otru roku. ", "Daarna met de andere hand. "], "Потом двумя руками одновременно.": ["Danach mit beiden Händen gleichzeitig.", "Потім двома руками одночасно.", "Pēc tam ar abām rokām vienlaikus.", "Daarna met beide handen tegelijk."], " раз": [" Mal", " разів", " reizes", " keer"], "Ловим, если это можно съесть.": ["Fangen, wenn man es essen kann.", "Ловимо, якщо це можна з’їсти.", "Ķeram, ja to var ēst.", "We vangen het als je het kunt eten."], "Ловим, если это живое.": ["Fangen, wenn es lebt.", "Ловимо, якщо це живе.", "Ķeram, ja tas ir dzīvs.", "We vangen het als het leeft."], "лишнее: ": ["Das Unpassende: ", "зайве: ", "lieks: ", "past er niet bij: "], "Назовите четыре слова. Ребёнок находит лишнее и объясняет, как назвать остальные одним словом.": ["Nennen Sie vier Wörter. Das Kind findet das unpassende und erklärt, wie man die übrigen mit einem Wort nennt.", "Назвіть чотири слова. Дитина знаходить зайве й пояснює, як назвати решту одним словом.", "Nosauciet četrus vārdus. Bērns atrod lieko un paskaidro, kā nosaukt pārējos vienā vārdā.", "Noem vier woorden. Het kind zoekt het woord dat er niet bij past en legt uit hoe je de rest met één woord noemt."], "Для малышей — слова вместо цифр:": ["Für die Kleinen – Wörter statt Zahlen:", "Для малюків — слова замість цифр:", "Mazajiem — vārdi cipariņu vietā:", "Voor de kleintjes – woorden in plaats van cijfers:"], "Тише": ["Ruhe", "Тихо", "Klusāk", "Stil"], "Выключить движение картинок": ["Bewegung der Bilder ausschalten", "Вимкнути рух картинок", "Izslēgt attēlu kustību", "Beweging van de plaatjes uitzetten"], "минут": ["Minuten", "хвилин", "minūtes", "minuten"], "Закончить занятие": ["Übung beenden", "Закінчити заняття", "Beigt nodarbību", "Oefening afsluiten"], "Морковка — в корзинку!": ["Eine Karotte für das Körbchen!", "Морквинка — у кошик!", "Burkāns grozā!", "Een wortel voor het mandje!"], "Голос": ["Stimme", "Голос", "Balss", "Stem"], "Готово! Задание пройдено до конца.": ["Fertig! Du hast die ganze Aufgabe geschafft.", "Готово! Завдання пройдено до кінця.", "Gatavs! Uzdevums izpildīts līdz galam.", "Klaar! Je hebt de hele opdracht gedaan."], "Выбери задание, распечатай лист и возьми карандаш.": ["Such dir eine Aufgabe aus, druck das Blatt aus und nimm einen Stift.", "Обери завдання, роздрукуй аркуш і візьми олівець.", "Izvēlies uzdevumu, izdrukā lapu un paņem zīmuli.", "Kies een opdracht, print het blad uit en pak een potlood."], "Выбери задание. Можно начать с того, что больше нравится.": ["Such dir eine Aufgabe aus. Du kannst mit der anfangen, die dir am besten gefällt.", "Обери завдання. Можна почати з того, що більше подобається.", "Izvēlies uzdevumu. Vari sākt ar to, kas patīk visvairāk.", "Kies een opdracht. Je mag beginnen met degene die je het leukst vindt."], "Подвигаемся вместе! Выбери игру.": ["Lass uns zusammen bewegen! Such dir ein Spiel aus.", "Порухаймося разом! Обери гру.", "Pakustēsimies kopā! Izvēlies spēli.", "Laten we samen bewegen! Kies een spel."], "На сегодня всё. Отдыхаем, а завтра будет новое занятие.": ["Für heute ist Schluss. Wir ruhen uns aus, und morgen gibt es eine neue Übung.", "На сьогодні все. Відпочиваємо, а завтра буде нове заняття.", "Šodien viss. Atpūšamies, bet rīt būs jauna nodarbība.", "Voor vandaag is het genoeg. We rusten uit en morgen is er een nieuwe oefening."], "Привет! Я зайка Нико. Сначала разомнёмся вместе.": ["Hallo! Ich bin Niko, der Hase. Zuerst wärmen wir uns zusammen auf.", "Привіт! Я зайчик Ніко. Спочатку разом розімнемося.", "Čau! Es esmu zaķis Niko. Vispirms kopā iesildīsimies.", "Hoi! Ik ben Niko, het konijn. Eerst warmen we samen op."], "Вот первое задание. Не спеши, у нас есть время.": ["Hier ist die erste Aufgabe. Keine Eile, wir haben Zeit.", "Ось перше завдання. Не поспішай, у нас є час.", "Lūk, pirmais uzdevums. Nesteidzies, mums ir laiks.", "Hier is de eerste opdracht. Geen haast, we hebben tijd."], "Перерыв! Попрыгаем и подвигаемся.": ["Pause! Wir hüpfen und bewegen uns.", "Перерва! Пострибаємо й порухаємося.", "Pārtraukums! Palēkāsim un pakustēsimies.", "Pauze! We springen en bewegen."], "Второе задание. Подумаем вместе.": ["Die zweite Aufgabe. Wir denken zusammen nach.", "Друге завдання. Подумаємо разом.", "Otrais uzdevums. Padomāsim kopā.", "De tweede opdracht. We denken samen na."], "Ещё одно задание, и оно необычное. Попробуем?": ["Noch eine Aufgabe, und sie ist etwas Besonderes. Probieren wir es?", "Ще одне завдання, і воно незвичайне. Спробуємо?", "Vēl viens uzdevums, un tas ir neparasts. Pamēģināsim?", "Nog een opdracht, en die is bijzonder. Zullen we het proberen?"], "Последнее задание — лёгкое. У тебя получится!": ["Die letzte Aufgabe ist leicht. Du schaffst das!", "Останнє завдання — легке. У тебе вийде!", "Pēdējais uzdevums ir viegls. Tev izdosies!", "De laatste opdracht is makkelijk. Jij kunt het!"], "Бонус! Хочешь — попробуем, не хочешь — отдохнём.": ["Bonus! Wenn du magst, probieren wir es, wenn nicht, ruhen wir uns aus.", "Бонус! Хочеш — спробуємо, не хочеш — відпочинемо.", "Bonuss! Ja gribi, pamēģināsim, ja negribi — atpūtīsimies.", "Bonus! Als je wilt, proberen we het, en anders rusten we uit."], "Хвалите за старание и за то, что получилось лучше, чем в прошлый раз, а не за «умный».": ["Loben Sie die Mühe und das, was besser klappte als beim letzten Mal, nicht das „Schlaue“.", "Хваліть за старання і за те, що вийшло краще, ніж минулого разу, а не за «розумний».", "Uzslavējiet par pūlēm un par to, kas padevās labāk nekā iepriekšējo reizi, nevis par to, ka bērns ir „gudrs”.", "Prijs de inzet en wat beter ging dan de vorige keer, en niet het „slimme”."], "Если ребёнок устал или плачет, остановитесь и вернитесь к движению. Короткое занятие лучше, чем через силу.": ["Wenn das Kind müde ist oder weint, hören Sie auf und kehren Sie zur Bewegung zurück. Eine kurze Übung ist besser als eine erzwungene.", "Якщо дитина втомилася чи плаче, зупиніться й поверніться до руху. Коротке заняття краще, ніж через силу.", "Ja bērns ir noguris vai raud, apstāties un atgriezieties pie kustībām. Īsa nodarbība ir labāka nekā piespiedu.", "Is je kind moe of huilt het, stop dan en ga terug naar bewegen. Een korte oefening is beter dan een afgedwongen oefening."], "Ваше спокойствие передаётся ребёнку. Сделайте вдох, прежде чем помогать.": ["Ihre Ruhe überträgt sich auf das Kind. Atmen Sie ein, bevor Sie helfen.", "Ваш спокій передається дитині. Зробіть вдих, перш ніж допомагати.", "Jūsu mierīgums pāriet uz bērnu. Ieelpojiet, pirms palīdzat.", "Jouw rust gaat over op je kind. Adem in voordat je helpt."], "Помогайте по нарастающей: сначала подождите, потом подскажите взглядом, потом словом, и только потом покажите.": ["Helfen Sie schrittweise: Warten Sie zuerst, dann geben Sie einen Hinweis mit dem Blick, dann mit Worten und erst danach zeigen Sie es.", "Допомагайте поступово: спочатку зачекайте, потім підкажіть поглядом, потім словом, і лише потім покажіть.", "Palīdziet pakāpeniski: vispirms pagaidiet, tad pasakiet ar skatienu, tad ar vārdiem un tikai pēc tam parādiet.", "Help stap voor stap: wacht eerst, geef dan een hint met je blik, dan met woorden, en laat het pas daarna zien."], "Пусть ребёнок сам выберет, с какого задания начать. Выбор поддерживает интерес.": ["Lassen Sie das Kind selbst wählen, mit welcher Aufgabe es beginnt. Die Wahl hält das Interesse wach.", "Нехай дитина сама обере, з якого завдання почати. Вибір підтримує інтерес.", "Lai bērns pats izvēlas, ar kuru uzdevumu sākt. Izvēle uztur interesi.", "Laat je kind zelf kiezen met welke opdracht het begint. Kiezen houdt de interesse vast."], "Не исправляйте во время работы. Проверьте вместе, когда задание закончено.": ["Korrigieren Sie nicht während der Arbeit. Prüfen Sie gemeinsam, wenn die Aufgabe fertig ist.", "Не виправляйте під час роботи. Перевірте разом, коли завдання закінчено.", "Neizlabojiet darba laikā. Pārbaudiet kopā, kad uzdevums ir pabeigts.", "Verbeter niet tijdens het werk. Kijk samen na als de opdracht klaar is."], "весёлый праздник": ["ein fröhliches Fest", "веселе свято", "jautrs svētki", "een vrolijk feest"], "дружба": ["Freundschaft", "дружба", "draudzība", "vriendschap"], "тёплый вечер": ["ein warmer Abend", "теплий вечір", "silts vakars", "een warme avond"], "сильный ветер": ["ein starker Wind", "сильний вітер", "stiprs vējš", "een harde wind"], "вкусный ужин": ["ein leckeres Abendessen", "смачна вечеря", "garšīgas vakariņas", "een lekker avondeten"], figūras izsvītrojam, citas apvelkam. Dari tā katrā rindā.", "Kijk naar het voorbeeld bovenaan. Sommige figuren strepen we door, andere omcirkelen we. Doe dat in elke rij."], "Зачеркни букву из образца. Но если прямо перед ней стоит другая буква из образца — обведи её.": ["Streiche den Buchstaben aus dem Muster durch. Aber wenn direkt davor der andere Buchstabe aus dem Muster steht, umkreise ihn.", "Закресли літеру із зразка. Але якщо просто перед нею стоїть інша літера зі зразка — обведи її.", "Izsvītro burtu no parauga. Bet ja tieši pirms tā ir otrs burts no parauga, apvelc to.", "Streep de letter uit het voorbeeld door. Maar staat vlak ervoor de andere letter uit het voorbeeld? Omcirkel hem dan."], "Занятие пройдено: разминка, три задания, подвижная игра и лёгкий финал.": ["Geschafft: Aufwärmen, drei Aufgaben, ein Bewegungsspiel und ein leichter Abschluss.", "Заняття пройдено: розминка, три завдання, рухлива гра й легкий фінал.", "Nodarbība pabeigta: iesildīšanās, trīs uzdevumi, kustību spēle un viegls noslēgums.", "Oefening gedaan: opwarmen, drie opdrachten, een bewegingsspel en een makkelijke afsluiting."], "Занятие пройдено: разминка, два задания, подвижная игра и лёгкий финал.": ["Geschafft: Aufwärmen, zwei Aufgaben, ein Bewegungsspiel und ein leichter Abschluss.", "Заняття пройдено: розминка, два завдання, рухлива гра й легкий фінал.", "Nodarbība pabeigta: iesildīšanās, divi uzdevumi, kustību spēle un viegls noslēgums.", "Oefening gedaan: opwarmen, twee opdrachten, een bewegingsspel en een makkelijke afsluiting."], "явления природы": ["Naturerscheinungen", "явища природи", "dabas parādības", "natuurverschijnselen"], "части дома": ["Teile des Hauses", "частини будинку", "mājas daļas", "delen van het huis"], "морские жители": ["Meerestiere", "морські мешканці", "jūras iemītnieki", "zeedieren"], "виды спорта": ["Sportarten", "види спорту", "sporta veidi", "sporten"], "обувь": ["Schuhe", "взуття", "apavi", "schoenen"], "Нельзя повторять:": ["Nicht nachmachen:", " Двома руками одночасно: туди й назад, 4 рази.", "Ar abām rokām vienlaikus: turp un atpakaļ, 4 reizes.", "Met beide handen tegelijk: heen en terug, 4 keer."], "Двумя руками одновременно, но в разные стороны: правая от указательного, левая от мизинца. Потом с закрытыми глазами.": ["Mit beiden Händen gleichzeitig, aber in verschiedene Richtungen: die rechte beginnt beim Zeigefinger, die linke beim kleinen Finger. Danach mit geschlossenen Augen.", "Двома руками одночасно, але в різні боки: права від вказівного, ліва від мізинця. Потім із заплющеними очима.", "Ar abām rokām vienlaikus, bet pretējos virzienos: labā sāk ar rādītājpirkstu, kreisā — ar mazo pirkstiņu. Pēc tam ar aizvērtām acīm.", "Met beide handen tegelijk, maar in verschillende richtingen: de rechter begint bij de wijsvinger, de linker bij de pink. Daarna met gesloten ogen."], "Найди кружки по порядку: от самого маленького до самого большого.": ["Finde die Kreise der Reihe nach: vom kleinsten bis zum größten.", "Знайди кружки по порядку: від найменшого до найбільшого.", "Atrodi apļus pēc kārtas: no mazākā līdz lielākajam.", "Zoek de cirkels op volgorde: van de kleinste tot de grootste."], "Найди числа по порядку от # до #.": ["Finde die Zahlen der Reihe nach von # bis #.", "Знайди числа по порядку від # до #.", "Atrodi skaitļus pēc kārtas no # līdz #.", "Zoek de getallen op volgorde van # tot #."], "Найди буквы по алфавиту: #, #, #…": ["Finde die Buchstaben in der Reihenfolge des Alphabets: #, #, #…", "Знайди літери за абеткою: #, #, #…", "Atrodi burtus alfabēta secībā: #, #, #…", "Zoek de letters op alfabetvolgorde: #, #, #…"], "Чередуй: число — буква. #, #, #, #, #, #…": ["Wechsle ab: Zahl — Buchstabe. #, #, #, #, #, #…", "Чергуй: число — літера. #, #, #, #, #, #…", "Mainies: skaitlis — burts. #, #, #, #, #, #…", "Wissel af: getal, letter. #, #, #, #, #, #…"], "Чередуй цвета: тёмные числа по возрастанию, красные — по убыванию. # тёмное, # красное, # тёмное, # красное…": ["Wechsle die Farben ab: dunkle Zahlen aufsteigend, rote absteigend. # dunkel, # rot, # dunkel, # rot…", "Чергуй кольори: темні числа за зростанням, червоні — за спаданням. # темне, # червоне, # темне, # червоне…", "Mainies pa krāsām: tumšie skaitļi augošā secībā, sarkanie — dilstošā. # tumšais, # sarkanais, # tumšais, # sarkanais…", "Wissel de kleuren af: donkere getallen oplopend, rode aflopend. # donker, # rood, # donker, # rood…"], "Посмотри на ряд и найди, что будет дальше.": ["Schau dir die Reihe an und finde heraus, was als Nächstes kommt.", "Подивись на ряд і знайди, що буде далі.", "Paskaties uz rindu un atrodi, kas sekos tālāk.", "Kijk naar de rij en zoek uit wat er daarna komt."], "Посмотри на образец и отметь каждую фигуру так же.": ["Schau dir das Muster an und markiere jede Figur genauso.", "Подивись на зразок і познач кожну фігуру так само.", "Paskaties uz paraugu un atzīmē katru figūru tāpat.", "Kijk naar het voorbeeld en markeer elke figuur op dezelfde manier."], "Отметь каждую фигуру знаком из образца. Посередине образец поменяется — будь внимателен!": ["Markiere jede Figur mit dem Zeichen aus dem Muster. In der Mitte ändert sich das Muster – schau gut hin!", "Познач кожну фігуру знаком зі зразка. Посередині зразок зміниться — тож придивляйся уважно!", "Atzīmē katru figūru ar zīmi no parauga. Pa vidu paraugs mainīsies — tāpēc skaties uzmanīgi!", "Markeer elke figuur met het teken uit het voorbeeld. Halverwege verandert het voorbeeld, dus let goed op!"], "Найди все фигуры, точно такие же, как образец, и обведи их.": ["Finde alle Figuren, die genau so aussehen wie das Muster, und umkreise sie.", "Знайди всі фігури, точно такі самі, як зразок, і обведи їх.", "Atrodi visas figūras, kas ir tieši tādas pašas kā paraugs, un apvelc tās.", "Zoek alle figuren die precies hetzelfde zijn als het voorbeeld en omcirkel ze."], "Проследи глазами каждую линию. Нажми на номер слева, а потом на фигуру, где линия заканчивается.": ["Verfolge jede Linie mit den Augen. Tippe links auf die Nummer und dann auf die Figur, bei der die Linie endet.", "Простеж очима кожну лінію. Натисни на номер ліворуч, а потім на фігуру, де лінія закінчується.", "Izseko ar acīm katru līniju. Uzspied uz numuru kreisajā pusē un tad uz figūru, kurā līnija beidzas.", "Volg elke lijn met je ogen. Tik links op het nummer en dan op de figuur waar de lijn eindigt."], "Нажимай, только когда увидишь звёздочку.": ["Tippe nur, wenn du einen Stern siehst.", "Натискай, тільки коли побачиш зірочку.", "Spied tikai tad, kad ieraugi zvaigznīti.", "Tik alleen als je een ster ziet."], "Нажимай на всё, кроме звёздочки.": ["Tippe auf alles außer auf den Stern.", "Натискай на все, крім зірочки.", "Spied uz visu, izņemot zvaigznīti.", "Tik op alles, behalve op de ster."], "Сначала нажимай только на звёздочку. Потом правило поменяется!": ["Tippe zuerst nur auf den Stern. Dann ändert sich die Regel!", "Спочатку натискай тільки на зірочку. Потім правило зміниться!", "Sākumā spied tikai uz zvaigznīti. Pēc tam noteikums mainīsies!", "Tik eerst alleen op de ster. Daarna verandert de regel!"], "Нажимай на звёздочку, только если перед ней был кружок.": ["Tippe nur dann auf den Stern, wenn vorher ein Kreis kam.", "Натискай на зірочку, тільки якщо перед нею був кружок.", "Spied uz zvaigznīti tikai tad, ja pirms tās bija aplis.", "Tik alleen op de ster als er vlak ervoor een cirkel was."], "Какая фигура спряталась за линиями? Найди её внизу и обведи.": ["Welche Figur hat sich hinter den Linien versteckt? Finde sie unten und umkreise sie.", "Яка фігура сховалася за лініями? Знайди її внизу й обведи.", "Kura figūra paslēpusies aiz līnijām? Atrodi to apakšā un apvelc.", "Welke figuur zit verstopt achter de lijnen? Zoek hem onderaan en omcirkel hem."], "Какие фигуры спрятались на картинке? Найди их внизу и обведи.": ["Welche Figuren haben sich im Bild versteckt? Finde sie unten und umkreise sie.", "Які фігури сховалися на картинці? Знайди їх внизу й обведи.", "Kuras figūras paslēpušās attēlā? Atrodi tās apakšā un apvelc.", "Welke figuren zitten verstopt in het plaatje? Zoek ze onderaan en omcirkel ze."], "Сравни две картинки и найди на второй # отличия. Обведи их.": ["Vergleiche die zwei Bilder und finde im zweiten # Unterschiede. Umkreise sie.", "Порівняй дві картинки й знайди на другій # відмінності. Обведи їх.", "Salīdzini abus attēlus un otrajā atrodi # atšķirības. Apvelc tās.", "Vergelijk de twee plaatjes en zoek op het tweede # verschillen. Omcirkel ze."], "Сравни две картинки и найди на второй # отличий. Обведи их.": ["Vergleiche die zwei Bilder und finde im zweiten # Unterschiede. Umkreise sie.", "Порівняй дві картинки й знайди на другій # відмінностей. Обведи їх.", "Salīdzini abus attēlus un otrajā atrodi # atšķirības. Apvelc tās.", "Vergelijk de twee plaatjes en zoek op het tweede # verschillen. Omcirkel ze."], "Расставь фигуры на поле так, как сказано. Выбери фигуру, а потом нажми на клетку.": ["Stelle die Figuren so aufs Feld, wie es gesagt wird. Wähle eine Figur und tippe dann auf ein Feld.", "Розстав фігури на полі так, як сказано. Обери фігуру, а потім натисни на клітинку.", "Izvieto figūras laukumā tā, kā teikts. Izvēlies figūru un tad uzspied uz rūtiņas.", "Zet de figuren op het bord, zoals er gezegd wordt. Kies een figuur en tik dan op een vakje."], "Посмотри на образец и нарисуй такой же узор. Нажимай на две соседние точки, чтобы провести линию.": ["Schau dir das Muster an und zeichne dasselbe Muster. Tippe auf zwei benachbarte Punkte, um eine Linie zu ziehen.", "Подивись на зразок і намалюй такий самий візерунок. Натискай на дві сусідні точки, щоб провести лінію.", "Paskaties uz paraugu un uzzīmē tādu pašu rakstu. Spied uz diviem blakus punktiem, lai novilktu līniju.", "Kijk naar het voorbeeld en teken hetzelfde patroon. Tik op twee punten naast elkaar om een lijn te trekken."], "Нарисуй узор зеркально, как отражение в зеркале. Нажимай на две соседние точки, чтобы провести линию.": ["Zeichne das Muster spiegelverkehrt, wie im Spiegel. Tippe auf zwei benachbarte Punkte, um eine Linie zu ziehen.", "Намалюй візерунок дзеркально, як відображення в дзеркалі. Натискай на дві сусідні точки, щоб провести лінію.", "Uzzīmē rakstu spoguļattēlā, kā atspulgu spogulī. Spied uz diviem blakus punktiem, lai novilktu līniju.", "Teken het patroon gespiegeld, zoals een spiegelbeeld. Tik op twee punten naast elkaar om een lijn te trekken."], "Рисуй по команде: число — сколько клеток, стрелка — куда. Нажимай на стрелки внизу.": ["Zeichne nach Ansage: Die Zahl sagt, wie viele Kästchen, der Pfeil sagt, wohin. Tippe unten auf die Pfeile.", "Малюй за командою: число — скільки клітинок, стрілка — куди. Натискай на стрілки внизу.", "Zīmē pēc norādēm: skaitlis — cik rūtiņu, bultiņa — uz kurieni. Spied uz bultiņām apakšā.", "Teken volgens de opdracht: het getal zegt hoeveel hokjes, de pijl zegt welke kant op. Tik onderaan op de pijlen."], "Поставь карандаш на точку и рисуй по команде: число — сколько клеток, стрелка — куда.": ["Setze den Stift auf den Punkt und zeichne nach Ansage: Die Zahl sagt, wie viele Kästchen, der Pfeil sagt, wohin.", "Постав олівець на точку й малюй за командою: число — скільки клітинок, стрілка — куди.", "Uzliec zīmuli uz punkta un zīmē pēc norādēm: skaitlis — cik rūtiņu, bultiņa — uz kurieni.", "Zet je potlood op het stipje en teken volgens de opdracht: het getal zegt hoeveel hokjes, de pijl zegt welke kant op."], "Поставь карандаш на точку и рисуй по команде: число — сколько клеток, стрелка — куда. Повтори узор # раза.": ["Setze den Stift auf den Punkt und zeichne nach Ansage: Die Zahl sagt, wie viele Kästchen, der Pfeil sagt, wohin. Wiederhole das Muster #-mal.", "Постав олівець на точку й малюй за командою: число — скільки клітинок, стрілка — куди. Повтори візерунок # рази.", "Uzliec zīmuli uz punkta un zīmē pēc norādēm: skaitlis — cik rūtiņu, bultiņa — uz kurieni. Atkārto rakstu # reizes.", "Zet je potlood op het stipje en teken volgens de opdracht: het getal zegt hoeveel hokjes, de pijl zegt welke kant op. Herhaal het patroon # keer."], "Запомни фигуры. Потом одна спрячется — найди, какая.": ["Merk dir die Figuren. Dann versteckt sich eine – finde heraus, welche.", "Запам’ятай фігури. Потім одна сховається — знайди, яка.", "Iegaumē figūras. Pēc tam viena paslēpsies — atrodi, kura.", "Onthoud de figuren. Dan verdwijnt er één – zoek uit welke."], "Запомни картинки. Потом одна спрячется — найди, какая.": ["Merk dir die Bilder. Dann versteckt sich eines – finde heraus, welches.", "Запам’ятай картинки. Потім одна сховається — знайди, яка.", "Iegaumē attēlus. Pēc tam viens paslēpsies — atrodi, kurš.", "Onthoud de plaatjes. Dan verdwijnt er één – zoek uit welke."], "Запомни фигуры. Потом две спрячутся — найди, какие.": ["Merk dir die Figuren. Dann verstecken sich zwei – finde heraus, welche.", "Запам’ятай фігури. Потім дві сховаються — знайди, які.", "Iegaumē figūras. Pēc tam divas paslēpsies — atrodi, kuras.", "Onthoud de figuren. Dan verdwijnen er twee – zoek uit welke."], "Запомни картинки. Потом две спрячутся — найди, какие.": ["Merk dir die Bilder. Dann verstecken sich zwei – finde heraus, welche.", "Запам’ятай картинки. Потім дві сховаються — знайди, які.", "Iegaumē attēlus. Pēc tam divi paslēpsies — atrodi, kuri.", "Onthoud de plaatjes. Dan verdwijnen er twee – zoek uit welke."], "Запомни, как стоят фигуры. Потом две поменяются местами — нажми на них.": ["Merk dir, wie die Figuren stehen. Dann tauschen zwei die Plätze – tippe auf sie.", "Запам’ятай, як стоять фігури. Потім дві поміняються місцями — натисни на них.", "Iegaumē, kā figūras stāv. Pēc tam divas samainīsies vietām — uzspied uz tām.", "Onthoud hoe de figuren staan. Dan wisselen er twee van plaats – tik erop."], "Запомни, как стоят картинки. Потом две поменяются местами — нажми на них.": ["Merk dir, wie die Bilder stehen. Dann tauschen zwei die Plätze – tippe auf sie.", "Запам’ятай, як стоять картинки. Потім дві поміняються місцями — натисни на них.", "Iegaumē, kā attēli atrodas. Pēc tam divi samainīsies vietām — uzspied uz tiem.", "Onthoud hoe de plaatjes staan. Dan wisselen er twee van plaats – tik erop."], "Запомни, какие клетки загорелись, и нажми на них.": ["Merk dir, welche Felder aufgeleuchtet haben, und tippe auf sie.", "Запам’ятай, які клітинки засвітилися, і натисни на них.", "Iegaumē, kuras rūtiņas iedegās, un uzspied uz tām.", "Onthoud welke vakjes oplichten en tik erop."], "Запомни, какие клетки загорелись и в каком порядке. Потом нажми на них по порядку.": ["Merk dir, welche Felder aufgeleuchtet haben und in welcher Reihenfolge. Dann tippe sie der Reihe nach an.", "Запам’ятай, які клітинки засвітилися і в якому порядку. Потім натисни на них по порядку.", "Iegaumē, kuras rūtiņas iedegās un kādā secībā. Pēc tam uzspied uz tām pēc kārtas.", "Onthoud welke vakjes oplichten en in welke volgorde. Tik ze dan op volgorde aan."], "Запомни фигуры. Потом найди их среди других и нажми на них.": ["Merk dir die Figuren. Dann finde sie unter den anderen und tippe auf sie.", "Запам’ятай фігури. Потім знайди їх серед інших і натисни на них.", "Iegaumē figūras. Pēc tam atrodi tās starp citām un uzspied uz tām.", "Onthoud de figuren. Zoek ze dan tussen de andere figuren en tik erop."], "Запомни картинки. Потом найди их среди других и нажми на них.": ["Merk dir die Bilder. Dann finde sie unter den anderen und tippe auf sie.", "Запам’ятай картинки. Потім знайди їх серед інших і натисни на них.", "Iegaumē attēlus. Pēc tam atrodi tos starp citiem un uzspied uz tiem.", "Onthoud de plaatjes. Zoek ze dan tussen de andere plaatjes en tik erop."], "В каждом ряду найди лишнюю фигуру и обведи её. Объясни, почему она лишняя.": ["Finde in jeder Reihe die Figur, die nicht dazugehört, und umkreise sie. Erkläre, warum sie nicht dazugehört.", "У кожному ряду знайди зайву фігуру й обведи її. Поясни, чому вона зайва.", "Katrā rindā atrodi lieko figūru un apvelc to. Paskaidro, kāpēc tā ir lieka.", "Zoek in elke rij de figuur die er niet bij hoort en omcirkel hem. Leg uit waarom hij er niet bij hoort."], "В каждом ряду найди лишнюю картинку и обведи её. Объясни, почему она лишняя.": ["Finde in jeder Reihe das Bild, das nicht dazugehört, und umkreise es. Erkläre, warum es nicht dazugehört.", "У кожному ряду знайди зайву картинку й обведи її. Поясни, чому вона зайва.", "Katrā rindā atrodi lieko attēlu un apvelc to. Paskaidro, kāpēc tas ir lieks.", "Zoek in elke rij het plaatje dat er niet bij hoort en omcirkel het. Leg uit waarom het er niet bij hoort."], "Посмотри на ряды и столбцы. Какая фигура должна стоять в пустой клетке?": ["Schau dir die Reihen und Spalten an. Welche Figur gehört in das leere Feld?", "Подивись на рядки й стовпці. Яка фігура має стояти в порожній клітинці?", "Paskaties uz rindām un kolonnām. Kurai figūrai jāatrodas tukšajā rūtiņā?", "Kijk naar de rijen en kolommen. Welke figuur hoort in het lege vakje?"], "Разложи фигуры по цвету. Нажми на фигуру, а потом на коробку.": ["Sortiere die Figuren nach Farbe. Tippe auf eine Figur und dann auf eine Schachtel.", "Розклади фігури за кольором. Натисни на фігуру, а потім на коробку.", "Sakārto figūras pēc krāsas. Uzspied uz figūras un tad uz kastes.", "Sorteer de figuren op kleur. Tik op een figuur en dan op een doos."], "Разложи картинки: что к чему подходит. Нажми на картинку, а потом на коробку.": ["Sortiere die Bilder: Was passt zusammen? Tippe auf ein Bild und dann auf eine Schachtel.", "Розклади картинки: що до чого підходить. Натисни на картинку, а потім на коробку.", "Sakārto attēlus: kas kuram der kopā. Uzspied uz attēla un tad uz kastes.", "Sorteer de plaatjes: wat hoort bij elkaar? Tik op een plaatje en dan op een doos."], "Разложи фигуры по форме. Нажми на фигуру, а потом на коробку.": ["Sortiere die Figuren nach Form. Tippe auf eine Figur und dann auf eine Schachtel.", "Розклади фігури за формою. Натисни на фігуру, а потім на коробку.", "Sakārto figūras pēc formas. Uzspied uz figūras un tad uz kastes.", "Sorteer de figuren op vorm. Tik op een figuur en dan op een doos."], "Разложи фигуры: большие — к большим, маленькие — к маленьким. Нажми на фигуру, а потом на коробку.": ["Sortiere die Figuren: Große zu Großen, Kleine zu Kleinen. Tippe auf eine Figur und dann auf eine Schachtel.", "Розклади фігури: великі — до великих, маленькі — до маленьких. Натисни на фігуру, а потім на коробку.", "Sakārto figūras: lielās pie lielajām, mazās pie mazajām. Uzspied uz figūras un tad uz kastes.", "Sorteer de figuren: grote bij de grote, kleine bij de kleine. Tik op een figuur en dan op een doos."], "Разложи картинки: большие — к большим, маленькие — к маленьким. Нажми на картинку, а потом на коробку.": ["Sortiere die Bilder: Große zu Großen, Kleine zu Kleinen. Tippe auf ein Bild und dann auf eine Schachtel.", "Розклади картинки: великі — до великих, маленькі — до маленьких. Натисни на картинку, а потім на коробку.", "Sakārto attēlus: lielos pie lielajiem, mazos pie mazajiem. Uzspied uz attēla un tad uz kastes.", "Sorteer de plaatjes: grote bij de grote, kleine bij de kleine. Tik op een plaatje en dan op een doos."], "В каждой коробке уже лежит одна фигура. Догадайся, по какому правилу раскладывать, и разложи остальные. Нажми на фигуру, а потом на коробку.": ["In jeder Schachtel liegt schon eine Figur. Errate, nach welcher Regel sortiert wird, und sortiere die übrigen. Tippe auf eine Figur und dann auf eine Schachtel.", "У кожній коробці вже лежить одна фігура. Здогадайся, за яким правилом розкладати, і розклади решту. Натисни на фігуру, а потім на коробку.", "Katrā kastē jau ir viena figūra. Uzmini, pēc kāda noteikuma jāsakārto, un sakārto pārējās. Uzspied uz figūras un tad uz kastes.", "In elke doos ligt al één figuur. Bedenk volgens welke regel je moet sorteren en sorteer de rest. Tik op een figuur en dan op een doos."], "В каждой коробке уже лежит одна картинка. Догадайся, по какому правилу раскладывать, и разложи остальные. Нажми на картинку, а потом на коробку.": ["In jeder Schachtel liegt schon ein Bild. Errate, nach welcher Regel sortiert wird, und sortiere die übrigen. Tippe auf ein Bild und dann auf eine Schachtel.", "У кожній коробці вже лежить одна картинка. Здогадайся, за яким правилом розкладати, і розклади решту. Натисни на картинку, а потім на коробку.", "Katrā kastē jau ir viens attēls. Uzmini, pēc kāda noteikuma jāsakārto, un sakārto pārējos. Uzspied uz attēla un tad uz kastes.", "In elke doos ligt al één plaatje. Bedenk volgens welke regel je moet sorteren en sorteer de rest. Tik op een plaatje en dan op een doos."], "Проведи пальцем по каждой дорожке от точки до звёздочки, не выходя за края.": ["Fahre mit dem Finger jeden Weg vom Punkt bis zum Stern entlang, ohne über den Rand zu fahren.", "Проведи пальцем по кожній доріжці від точки до зірочки, не виходячи за краї.", "Pavelc ar pirkstu pa katru taku no punkta līdz zvaigznītei, neizejot ārpus malām.", "Ga met je vinger langs elk pad, van het stipje tot de ster, zonder buiten de randen te komen."], "Обведи пальцем каждую линию по пунктиру.": ["Fahre jede gestrichelte Linie mit dem Finger nach.", "Обведи пальцем кожну лінію за пунктиром.", "Apvelc ar pirkstu katru līniju pa punktiem.", "Volg met je vinger elke stippellijn."], "Заштрихуй каждую фигуру так, как показано в квадратике рядом. Не выходи за контур.": ["Schraffiere jede Figur so, wie es im Kästchen daneben gezeigt ist. Male nicht über den Rand.", "Заштрихуй кожну фігуру так, як показано в квадратику поруч. Не виходь за контур.", "Iesvītro katru figūru tā, kā parādīts rūtiņā blakus. Neiziet pāri kontūrai.", "Arceer elke figuur zoals het getoond wordt in het vierkantje ernaast. Blijf binnen de lijnen."], "Посмотри на начало узора и продолжи его до конца строки.": ["Schau dir den Anfang des Musters an und setze es bis zum Ende der Zeile fort.", "Подивись на початок візерунка й продовж його до кінця рядка.", "Paskaties uz raksta sākumu un turpini to līdz rindas beigām.", "Kijk naar het begin van het patroon en zet het door tot het einde van de regel."], "Задания из": ["Aufgaben mit", "Завдання з", "Uzdevumi ar", "Opdra       h+=stats([[tr(UI.found),ok+" / "+tot,1],[tr(UI.missed),miss],[tr(UI.wrong),wr],[tr(UI.time),fmtTime(RT.elapsed)]],miss+wr===0)+'<p class="note">'+(miss+wr?tr(UI.legend):tr(UI.great))+'</p>'}

      h+='</div>'});
    if(RT.checked)h+=stats([[tr(UI.found),t.rows.length+" / "+t.rows.length,1],[tr(UI.wrong),RT.errors],[tr(UI.time),fmtTime(RT.elapsed)]],!RT.errors);
  }
  else if(t.kind==="lines"){h+=linesSVG(t,false);
    if(RT.checked){var c=0;for(var i=0;i<t.n;i++)if(RT.pairs[i]===t.perm[i])c++;h+=stats([[tr(UI.found),c+" / "+t.n,1],[tr(UI.time),fmtTime(RT.elapsed)]],c===t.n)}
  }

    h+=dictSVG(t,false);

    else h+=stats([[tr(UI.wrong),RT.errors,!RT.errors],[tr(UI.time),fmtTime(RT.elapsed)]],!RT.errors);
  }
  else if(t.kind==="place"){
    h+='<ol class="mlist">'+t.steps(L,false).map(function(s){return '<li>'+s+'</li>'}).join("")+'</ol>';
    h+='<div class="grid pboard" style="--cols:'+t.n+'">'+range(t.n*t.n).map(function(i){var s=RT.board[i],res="";
      if(RT.checked){var exp=t.objs.filter(function(o){return o.y*t.n+o.x===i})[0];if(exp&&s!==exp.s)res=" r-miss";else if(s&&(!exp||exp.s!==s))res=" r-wrong"}
      return '<button class="cell'+res+'" data-act="pcell" data-i="'+i+'">'+(s?fig({s:s,c:SHCOL[s]}):"")+'</button>'}).join("")+'</div>';

  }
  else if(t.kind==="dots"){
    h+='<div class="dotpair"><div><div class="pairlabel">'+tr(UI.sample)+'</div>'+dotsSVG(t,t.sample,false,false,"s")+'</div><div><div class="pairlabel">'+tr(UI.yours)+'</div>'+dotsSVG(t,RT.segs,true,false,"y")+'</div></div><p class="note">'+tr(UI.startHint)+'</p>';
    if(RT.checked){var tg=t.target,ok2=tg.filter(function(k){return RT.segs.indexOf(k)>=0}).length,ex2=RT.segs.filter(function(k){return tg.indexOf(k)<0}).length;
      var dgood=ok2===tg.length&&ex2===0;h+=stats([[tr(UI.found),ok2+" / "+tg.length,1],[tr(UI.extraLines),ex2],[tr(UI.time),fmtTime(RT.elapsed)]],dgood)+'<p class="note">'+(dgood?tr(UI.great):tr(UI.dotsLegend))+'</p>'}
  }
  else if(t.kind==="trace"){
    h+=traceSVG(t,false);

  var act='<div class="actions">';

  if(t.kind==="dots"&&!RT.checked)act+='<button class="btn ghost" data-act="dundo"'+(RT.segs.length?'':' disabled')+'>'+tr(UI.undoLine)+'</button><button class="btn ghost" data-act="dclear"'+(RT.segs.length?'':' disabled')+'>'+tr(UI.eraseAll)+'</button>';
  if(needDone)act+='<button class="btn" data-act="done">'+tr(UI.done)+'</button>';
  act+='<button class="btn'+(needDone?" ghost":"")+'" data-act="new">'+tr(UI.newTask)+'</button>';
  if(t.kind!=="stream")act+='<button class="btn ghost" data-act="again">'+tr(UI.again)+'</button>';
  act+='</div>';
  return h+act;
}
